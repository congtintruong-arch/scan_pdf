<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ScanPro AI • Professional Scanner</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://docs.opencv.org/4.8.0/opencv.js" async></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --primary-light: #818cf8;
      --secondary: #8b5cf6;
      --accent: #06b6d4;
      --success: #10b981;
      --danger: #f43f5e;
      --warning: #f59e0b;
      --dark: #0a0e1a;
      --dark-2: #131828;
      --gray-1: #f8fafc;
      --gray-2: #f1f5f9;
      --gray-3: #e2e8f0;
      --gray-5: #64748b;
      --gray-7: #334155;
      --radius-lg: 28px;
      --radius-md: 20px;
      --radius-sm: 14px;
      --radius-xs: 10px;
      --shadow-sm: 0 2px 8px -2px rgba(15, 23, 42, 0.08);
      --shadow-md: 0 8px 24px -8px rgba(15, 23, 42, 0.15);
      --shadow-lg: 0 20px 40px -16px rgba(15, 23, 42, 0.22);
      --shadow-glow: 0 12px 32px -8px rgba(99, 102, 241, 0.4);
      --shadow-glow-success: 0 12px 32px -8px rgba(16, 185, 129, 0.4);
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: 
        radial-gradient(ellipse 80% 60% at 50% 0%, #1e1b4b 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 100% 100%, #312e81 0%, transparent 50%),
        radial-gradient(ellipse 60% 50% at 0% 100%, #0e7490 0%, transparent 50%),
        #0a0e1a;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    /* ============ PHONE FRAME ============ */
    .phone-frame {
      width: 100%;
      max-width: 410px;
      height: 860px;
      max-height: 97vh;
      background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
      border-radius: 52px;
      box-shadow:
        0 60px 120px -40px rgba(0, 0, 0, 0.8),
        0 0 0 2px rgba(255, 255, 255, 0.08) inset,
        0 0 0 10px rgba(255, 255, 255, 0.02),
        0 0 0 11px rgba(255, 255, 255, 0.05);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 1;
    }

    /* Dynamic Island */
    .dynamic-island {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 110px;
      height: 32px;
      background: #000;
      border-radius: 20px;
      z-index: 100;
      box-shadow: 0 0 0 2px rgba(255,255,255,0.05);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 10px;
    }

    .dynamic-island::after {
      content: '';
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #1e3a5f, #0a0e1a);
      box-shadow: 0 0 0 1px rgba(255,255,255,0.1), inset 0 0 4px rgba(96, 165, 250, 0.4);
    }

    /* ============ STATUS BAR ============ */
    .status-bar {
      display: flex;
      justify-content: space-between;
      padding: 18px 32px 6px;
      font-size: 14px;
      font-weight: 700;
      color: #0f172a;
      background: transparent;
      letter-spacing: -0.2px;
      z-index: 5;
      position: relative;
    }

    .status-bar .time {
      font-feature-settings: "tnum";
    }

    .status-bar .icons {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
    }

    .status-bar .icons i {
      color: #0f172a;
    }

    /* ============ APP SCREEN ============ */
    .app-screen {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 0 18px 20px;
      display: flex;
      flex-direction: column;
      scrollbar-width: none;
      -ms-overflow-style: none;
      scroll-behavior: smooth;
    }

    .app-screen::-webkit-scrollbar { display: none; }

    /* ============ HEADER ============ */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 2px 14px;
      animation: slideDown 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .logo-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-mark {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6, #06b6d4);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 19px;
      box-shadow: 0 8px 20px -4px rgba(99, 102, 241, 0.5), inset 0 1px 0 rgba(255,255,255,0.3);
      position: relative;
      overflow: hidden;
    }

    .logo-mark::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, transparent 40%, rgba(255,255,255,0.2) 100%);
    }

    .logo-mark i { position: relative; z-index: 1; }

    .brand-text h1 {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #0f172a;
      line-height: 1.1;
    }

    .brand-text p {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #64748b;
      text-transform: uppercase;
      margin-top: 1px;
    }

    .header-btn {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: white;
      border: 1px solid #e2e8f0;
      color: #334155;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: var(--shadow-sm);
    }

    .header-btn:active {
      transform: scale(0.92);
      background: var(--gray-2);
    }

    /* ============ CAPTURE CARD ============ */
    .capture-card {
      background: linear-gradient(160deg, #ffffff 0%, #f1f5f9 100%);
      border-radius: var(--radius-lg);
      padding: 12px;
      margin-bottom: 16px;
      box-shadow: 
        0 20px 40px -16px rgba(15, 23, 42, 0.18),
        0 0 0 1px rgba(226, 232, 240, 0.8) inset;
      border: 1px solid #e2e8f0;
      position: relative;
      animation: fadeUp 0.5s 0.1s cubic-bezier(0.4, 0, 0.2, 1) backwards;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .camera-preview {
      width: 100%;
      aspect-ratio: 3 / 4;
      background: #0a0e1a;
      border-radius: var(--radius-md);
      overflow: hidden;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 24px 40px -20px rgba(0, 0, 0, 0.5);
    }

    #videoPreview, #previewCanvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #0a0e1a;
    }

    #previewCanvas { display: none; }

    #edgeCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 4;
      display: none;
    }

    /* Grid overlay */
    .grid-overlay {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      opacity: 0.35;
      background-image: 
        linear-gradient(rgba(255,255,255,0.15) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.15) 1px, transparent 1px);
      background-size: 33.33% 33.33%;
      display: none;
    }

    .grid-overlay.show { display: block; }

    .camera-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #cbd5e1;
      font-size: 14px;
      font-weight: 500;
      gap: 12px;
      background: linear-gradient(160deg, #1e293b, #0f172a);
      z-index: 2;
      text-align: center;
      padding: 24px;
    }

    .camera-placeholder .icon-wrap {
      width: 76px;
      height: 76px;
      border-radius: 24px;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      color: #818cf8;
      margin-bottom: 4px;
      backdrop-filter: blur(8px);
    }

    .camera-placeholder .main-text {
      font-size: 15px;
      font-weight: 700;
      color: #e2e8f0;
      letter-spacing: -0.2px;
    }

    .camera-placeholder .hint {
      font-size: 11.5px;
      color: #94a3b8;
      font-weight: 500;
      max-width: 220px;
      line-height: 1.5;
    }

    /* Scan guide */
    .scan-guide {
      position: absolute;
      inset: 14px;
      z-index: 3;
      pointer-events: none;
      display: none;
    }

    .scan-guide.active { display: block; }

    .corner {
      position: absolute;
      width: 32px;
      height: 32px;
      border: 3px solid #6366f1;
      filter: drop-shadow(0 0 8px rgba(99, 102, 241, 0.8));
    }

    .corner-tl { top: -2px; left: -2px; border-right: none; border-bottom: none; border-radius: 12px 0 0 0; }
    .corner-tr { top: -2px; right: -2px; border-left: none; border-bottom: none; border-radius: 0 12px 0 0; }
    .corner-bl { bottom: -2px; left: -2px; border-right: none; border-top: none; border-radius: 0 0 0 12px; }
    .corner-br { bottom: -2px; right: -2px; border-left: none; border-top: none; border-radius: 0 0 12px 0; }

    /* Auto badge */
    .auto-scan-badge {
      position: absolute;
      top: 14px;
      left: 14px;
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      font-size: 10px;
      font-weight: 800;
      padding: 6px 12px;
      border-radius: 30px;
      display: none;
      align-items: center;
      gap: 6px;
      z-index: 6;
      box-shadow: 0 6px 16px -4px rgba(16, 185, 129, 0.6);
      letter-spacing: 0.8px;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.2);
    }

    .auto-scan-badge.show { display: flex; }

    .auto-scan-badge .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: white;
      animation: pulse 1.2s infinite;
      box-shadow: 0 0 8px white;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.7); }
    }

    /* Counter badge */
    .page-counter-badge {
      position: absolute;
      top: 14px;
      right: 14px;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      color: white;
      font-size: 11px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 30px;
      z-index: 6;
      border: 1px solid rgba(255,255,255,0.15);
      letter-spacing: 0.3px;
    }

    /* Processing overlay */
    .processing-overlay {
      position: absolute;
      inset: 0;
      background: rgba(10, 14, 26, 0.9);
      backdrop-filter: blur(16px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      color: white;
      gap: 18px;
      border-radius: var(--radius-md);
    }

    .processing-overlay.show { display: flex; }

    .spinner-wrap {
      position: relative;
      width: 60px;
      height: 60px;
    }

    .spinner {
      width: 60px;
      height: 60px;
      border: 3px solid rgba(99, 102, 241, 0.15);
      border-top-color: #6366f1;
      border-right-color: #8b5cf6;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    .spinner-inner {
      position: absolute;
      inset: 12px;
      border: 2px solid rgba(6, 182, 212, 0.15);
      border-bottom-color: #06b6d4;
      border-radius: 50%;
      animation: spin 1.4s linear infinite reverse;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .processing-overlay span {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.3px;
      color: #e2e8f0;
    }

    /* ============ CAPTURE CONTROLS ============ */
    .capture-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 16px;
      padding: 0 6px;
    }

    .ctrl-btn {
      width: 48px;
      height: 48px;
      border-radius: 16px;
      background: white;
      border: 1px solid #e2e8f0;
      color: #334155;
      font-size: 17px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: var(--shadow-sm);
      position: relative;
    }

    .ctrl-btn:active {
      transform: scale(0.9);
      background: var(--gray-2);
    }

    .ctrl-btn.active {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      border-color: transparent;
      box-shadow: var(--shadow-glow);
    }

    .shutter-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .shutter-ring {
      position: absolute;
      width: 84px;
      height: 84px;
      border-radius: 50%;
      border: 2px solid transparent;
      background: linear-gradient(135deg, #6366f1, #8b5cf6, #06b6d4) border-box;
      -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      animation: rotateRing 6s linear infinite;
    }

    @keyframes rotateRing {
      to { transform: rotate(360deg); }
    }

    .shutter-btn {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: linear-gradient(145deg, #ffffff, #f1f5f9);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 
        0 10px 24px -6px rgba(15, 23, 42, 0.25),
        0 0 0 4px #ffffff,
        0 0 0 5px #e2e8f0,
        inset 0 1px 2px rgba(255,255,255,1);
      transition: all 0.15s;
      cursor: pointer;
      color: #6366f1;
      font-size: 26px;
      position: relative;
    }

    .shutter-btn:active {
      transform: scale(0.9);
      box-shadow: 
        0 6px 16px -4px rgba(15, 23, 42, 0.3),
        0 0 0 4px #ffffff,
        0 0 0 5px #818cf8;
    }

    .shutter-btn::after {
      content: '';
      position: absolute;
      inset: 6px;
      border-radius: 50%;
      border: 2px solid #e2e8f0;
      opacity: 0.6;
    }

    /* ============ SMART MODES ============ */
    .section-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4px;
      margin: 4px 0 10px;
    }

    .section-label h3 {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #64748b;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .section-label h3 i {
      font-size: 11px;
      color: #6366f1;
    }

    .modes-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 20px;
      animation: fadeUp 0.5s 0.2s cubic-bezier(0.4, 0, 0.2, 1) backwards;
    }

    .mode-card {
      background: white;
      border-radius: var(--radius-sm);
      padding: 12px 6px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      border: 1.5px solid #e2e8f0;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }

    .mode-card:active { transform: scale(0.95); }

    .mode-card.active {
      background: linear-gradient(150deg, #eef2ff, #faf5ff);
      border-color: #a5b4fc;
      box-shadow: 0 8px 20px -8px rgba(99, 102, 241, 0.4);
    }

    .mode-card.active::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, #6366f1, #8b5cf6, #06b6d4);
    }

    .mode-icon {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: linear-gradient(135deg, #eef2ff, #e0e7ff);
      color: #6366f1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      transition: all 0.2s;
    }

    .mode-card.active .mode-icon {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      box-shadow: 0 6px 14px -4px rgba(99, 102, 241, 0.6);
    }

    .mode-name {
      font-size: 10px;
      font-weight: 700;
      color: #475569;
      text-align: center;
      letter-spacing: -0.1px;
      line-height: 1.2;
    }

    .mode-card.active .mode-name { color: #4338ca; }

    /* ============ GALLERY ============ */
    .gallery-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding: 0 4px;
    }

    .gallery-header h3 {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #64748b;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .gallery-header h3 i { font-size: 11px; color: #6366f1; }

    .page-count-badge {
      font-size: 11px;
      font-weight: 800;
      color: #4338ca;
      background: linear-gradient(135deg, #eef2ff, #e0e7ff);
      padding: 5px 12px;
      border-radius: 30px;
      letter-spacing: 0.3px;
      border: 1px solid #c7d2fe;
    }

    .pages-grid {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding: 4px 4px 16px;
      scrollbar-width: none;
      min-height: 130px;
      scroll-snap-type: x mandatory;
    }

    .pages-grid::-webkit-scrollbar { display: none; }

    .page-thumb {
      flex: 0 0 92px;
      height: 122px;
      border-radius: 16px;
      background: #f1f5f9;
      border: 2px solid white;
      box-shadow: 0 10px 22px -8px rgba(15, 23, 42, 0.25);
      overflow: hidden;
      position: relative;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
      scroll-snap-align: start;
      animation: popIn 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.85); }
      to { opacity: 1; transform: scale(1); }
    }

    .page-thumb:active { transform: scale(0.94); }

    .page-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .page-thumb .thumb-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 60%, rgba(0,0,0,0.5) 100%);
      pointer-events: none;
    }

    .page-thumb .remove-badge {
      position: absolute;
      top: 6px;
      right: 6px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: #f43f5e;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
      border: 1px solid rgba(255,255,255,0.8);
      transition: transform 0.15s;
    }

    .page-thumb .remove-badge:active { transform: scale(0.85); }

    .page-thumb .thumb-index {
      position: absolute;
      bottom: 6px;
      left: 6px;
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(8px);
      color: #0f172a;
      font-size: 9.5px;
      font-weight: 800;
      padding: 3px 7px;
      border-radius: 8px;
      letter-spacing: 0.2px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    .page-thumb .thumb-edit {
      position: absolute;
      bottom: 6px;
      right: 6px;
      width: 22px;
      height: 22px;
      background: rgba(99, 102, 241, 0.95);
      backdrop-filter: blur(8px);
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 9px;

  <script>
    (function() {
      // ============ DOM ============
      const video = document.getElementById('videoPreview');
      const previewCanvas = document.getElementById('previewCanvas');
      const edgeCanvas = document.getElementById('edgeCanvas');
      const cameraPlaceholder = document.getElementById('cameraPlaceholder');
      const captureBtn = document.getElementById('captureBtn');
      const switchCameraBtn = document.getElementById('switchCameraBtn');
      const uploadBtn = document.getElementById('uploadBtn');
      const fileInput = document.getElementById('fileInput');
      const pagesGrid = document.getElementById('pagesGrid');
      const emptyGallery = document.getElementById('emptyGallery');
      const pageCountSpan = document.getElementById('pageCount');
      const exportPdfBtn = document.getElementById('exportPdfBtn');
      const sharePdfBtn = document.getElementById('sharePdfBtn');
      const toastEl = document.getElementById('toast');
      const toastText = document.getElementById('toastText');
      const toastIcon = toastEl.querySelector('.toast-icon i');
      const autoScanBadge = document.getElementById('autoScanBadge');
      const scanGuide = document.getElementById('scanGuide');
      const gridOverlay = document.getElementById('gridOverlay');
      const processingOverlay = document.getElementById('processingOverlay');
      const processingText = document.getElementById('processingText');
      const pageCounterBadge = document.getElementById('pageCounterBadge');
      const counterText = document.getElementById('counterText');
      const settingsBtn = document.getElementById('settingsBtn');

      const autoCropChip = document.getElementById('autoCropChip');
      const autoEnhanceChip = document.getElementById('autoEnhanceChip');
      const grayChip = document.getElementById('grayChip');
      const bwChip = document.getElementById('bwChip');

      const modalOverlay = document.getElementById('modalOverlay');
      const modalImage = document.getElementById('modalImage');
      const modalCloseBtn = document.getElementById('modalCloseBtn');
      const modalCancelBtn = document.getElementById('modalCancelBtn');
      const reapplyBtn = document.getElementById('reapplyBtn');
      const sharpnessSlider = document.getElementById('sharpnessSlider');
      const contrastSlider = document.getElementById('contrastSlider');
      const sharpnessValue = document.getElementById('sharpnessValue');
      const contrastValue = document.getElementById('contrastValue');

      // ============ State ============
      let stream = null;
      let currentFacingMode = 'environment';
      let scannedPages = [];
      let cameraActive = false;
      let opencvReady = false;
      let autoCropEnabled = true;
      let autoEnhanceEnabled = true;
      let grayEnabled = false;
      let bwEnabled = false;
      let currentPreviewPageId = null;

      // ============ Toast ============
      function showToast(msg, duration = 1800, iconClass = 'fa-check') {
        toastText.textContent = msg;
        toastIcon.className = `fas ${iconClass}`;
        toastEl.classList.add('show');
        clearTimeout(window.toastTimeout);
        window.toastTimeout = setTimeout(() => toastEl.classList.remove('show'), duration);
      }

      // ============ OpenCV ============
      function waitForOpenCV() {
        return new Promise((resolve) => {
          if (window.cv && window.cv.Mat) { opencvReady = true; resolve(); return; }
          const check = setInterval(() => {
            if (window.cv && window.cv.Mat) {
              opencvReady = true;
              clearInterval(check);
              resolve();
            }
          }, 200);
          setTimeout(() => { clearInterval(check); resolve(); }, 8000);
        });
      }

      // ============ Image Processing ============
      function detectDocumentCorners(srcCanvas) {
        if (!opencvReady) return null;
        try {
          const src = cv.imread(srcCanvas);
          const gray = new cv.Mat();
          const blurred = new cv.Mat();
          const edges = new cv.Mat();
          const contours = new cv.MatVector();
          const hierarchy = new cv.Mat();

          cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
          cv.GaussianBlur(gray, blurred, new cv.Size(5, 5), 0, 0, cv.BORDER_DEFAULT);
          cv.Canny(blurred, edges, 60, 180);
          cv.dilate(edges, edges, cv.Mat.ones(3, 3, cv.CV_8U), new cv.Point(-1, -1), 1);
          cv.findContours(edges, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

          let maxArea = 0, bestCorners = null;
          const imgArea = srcCanvas.width * srcCanvas.height;

          for (let i = 0; i < contours.size(); i++) {
            const cnt = contours.get(i);
            const area = cv.contourArea(cnt);
            if (area > maxArea && area > imgArea * 0.15) {
              const peri = cv.arcLength(cnt, true);
              const approx = new cv.Mat();
              cv.approxPolyDP(cnt, approx, 0.02 * peri, true);
              if (approx.rows === 4 && cv.isContourConvex(approx)) {
                maxArea = area;
                const pts = [];
                for (let j = 0; j < 4; j++) {
                  pts.push({ x: approx.data32S[j * 2], y: approx.data32S[j * 2 + 1] });
                }
                bestCorners = sortCorners(pts);
              }
              approx.delete();
            }
            cnt.delete();
          }

          src.delete(); gray.delete(); blurred.delete(); edges.delete();
          contours.delete(); hierarchy.delete();
          return bestCorners;
        } catch (e) { return null; }
      }

      function sortCorners(pts) {
        const sorted = [...pts];
        const sum = sorted.map(p => p.x + p.y);
        const diff = sorted.map(p => p.x - p.y);
        const tl = sorted[sum.indexOf(Math.min(...sum))];
        const br = sorted[sum.indexOf(Math.max(...sum))];
        const tr = sorted[diff.indexOf(Math.max(...diff))];
        const bl = sorted[diff.indexOf(Math.min(...diff))];
        return [tl, tr, br, bl];
      }

      function warpPerspective(srcCanvas, corners) {
        if (!opencvReady || !corners) return null;
        try {
          const src = cv.imread(srcCanvas);
          const [tl, tr, br, bl] = corners;
          const widthTop = Math.hypot(tr.x - tl.x, tr.y - tl.y);
          const widthBottom = Math.hypot(br.x - bl.x, br.y - bl.y);
          const heightLeft = Math.hypot(bl.x - tl.x, bl.y - tl.y);
          const heightRight = Math.hypot(br.x - tr.x, br.y - tr.y);
          const maxWidth = Math.max(widthTop, widthBottom);
          const maxHeight = Math.max(heightLeft, heightRight);

          const srcTri = cv.matFromArray(4, 1, cv.CV_32FC2, [tl.x, tl.y, tr.x, tr.y, br.x, br.y, bl.x, bl.y]);
          const dstTri = cv.matFromArray(4, 1, cv.CV_32FC2, [0, 0, maxWidth - 1, 0, maxWidth - 1, maxHeight - 1, 0, maxHeight - 1]);
          const M = cv.getPerspectiveTransform(srcTri, dstTri);
          const dst = new cv.Mat();
          const dsize = new cv.Size(Math.round(maxWidth), Math.round(maxHeight));
          cv.warpPerspective(src, dst, M, dsize, cv.INTER_LINEAR, cv.BORDER_CONSTANT, new cv.Scalar());

          const outCanvas = document.createElement('canvas');
          outCanvas.width = dst.cols;
          outCanvas.height = dst.rows;
          cv.imshow(outCanvas, dst);

          src.delete(); srcTri.delete(); dstTri.delete(); M.delete(); dst.delete();
          return outCanvas;
        } catch (e) { return null; }
      }

      function enhanceImage(srcCanvas, sharpness = 45, contrast = 30) {
        if (!opencvReady) return srcCanvas;
        try {
          const src = cv.imread(srcCanvas);
          let enhanced = new cv.Mat();

          if (contrast > 0) {
            const lab = new cv.Mat();
            cv.cvtColor(src, lab, cv.COLOR_RGBA2RGB);
            cv.cvtColor(lab, lab, cv.COLOR_RGB2Lab);
            const channels = new cv.MatVector();
            cv.split(lab, channels);
            const clahe = new cv.CLAHE(2.0 + contrast / 40, new cv.Size(8, 8));
            const l = channels.get(0);
            clahe.apply(l, l);
            channels.set(0, l);
            cv.merge(channels, lab);
            cv.cvtColor(lab, enhanced, cv.COLOR_Lab2RGB);
            cv.cvtColor(enhanced, enhanced, cv.COLOR_RGB2RGBA);
            lab.delete(); channels.delete(); l.delete();
          } else {
            src.copyTo(enhanced);
          }

          if (sharpness > 0) {
            const blurred = new cv.Mat();
            const sharp = new cv.Mat();
            cv.GaussianBlur(enhanced, blurred, new cv.Size(5, 5), 0, 0);
            const amount = sharpness / 100 * 1.5;
            cv.addWeighted(enhanced, 1 + amount, blurred, -amount, 0, sharp);
            enhanced.delete();
            enhanced = sharp;
            blurred.delete();
          }

          const out = document.createElement('canvas');
          out.width = enhanced.cols;
          out.height = enhanced.rows;
          cv.imshow(out, enhanced);
          src.delete(); enhanced.delete();
          return out;
        } catch (e) { return srcCanvas; }
      }

      function applyColorMode(srcCanvas, gray, bw) {
        if (!opencvReady || (!gray && !bw)) return srcCanvas;
        try {
          const src = cv.imread(srcCanvas);
          const grayMat = new cv.Mat();
          cv.cvtColor(src, grayMat, cv.COLOR_RGBA2GRAY);
          let result = new cv.Mat();
          if (bw) {
            cv.adaptiveThreshold(grayMat, result, 255, cv.ADAPTIVE_THRESH_GAUSSIAN_C, cv.THRESH_BINARY, 15, 8);
          } else {
            grayMat.copyTo(result);
          }
          cv.cvtColor(result, result, cv.COLOR_GRAY2RGBA);
          const out = document.createElement('canvas');
          out.width = result.cols;
          out.height = result.rows;
          cv.imshow(out, result);
          src.delete(); grayMat.delete(); result.delete();
          return out;
        } catch (e) { return srcCanvas; }
      }

      async function processImage(srcCanvas, options = {}) {
        const {
          doCrop = autoCropEnabled,
          doEnhance = autoEnhanceEnabled,
          doGray = grayEnabled,
          doBW = bwEnabled,
          sharpness = 45,
          contrast = 30
        } = options;

        let currentCanvas = srcCanvas;
        if (doCrop && opencvReady) {
          const corners = detectDocumentCorners(currentCanvas);
          if (corners) {
            const warped = warpPerspective(currentCanvas, corners);
            if (warped) currentCanvas = warped;
          }
        }
        if (doEnhance && opencvReady) {
          currentCanvas = enhanceImage(currentCanvas, sharpness, contrast);
        }
        if ((doGray || doBW) && opencvReady) {
          currentCanvas = applyColorMode(currentCanvas, doGray, doBW);
        }
        return currentCanvas;
      }

      function canvasToDataURL(canvas, quality = 0.95) {
        return canvas.toDataURL('image/jpeg', quality);
      }

      function dataURLToCanvas(dataURL) {
        return new Promise((resolve) => {
          const img = new Image();
          img.onload = () => {
            const c = document.createElement('canvas');
            c.width = img.width;
            c.height = img.height;
            c.getContext('2d').drawImage(img, 0, 0);
            resolve(c);
          };
          img.src = dataURL;
        });
      }

      // ============ Camera ============
      async function startCamera(facingMode = 'environment') {
        if (stream) {
          stream.getTracks().forEach(t => t.stop());
          stream = null;
        }
        try {
          stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode, width: { ideal: 1920 }, height: { ideal: 1080 } },
            audio: false
          });
          video.srcObject = stream;
          await video.play();
          cameraActive = true;
          cameraPlaceholder.style.display = 'none';
          video.style.display = 'block';
          previewCanvas.style.display = 'none';
          gridOverlay.classList.add('show');
          if (opencvReady) scanGuide.classList.add('active');
          currentFacingMode = facingMode;
        } catch (err) {
          showToast('Không thể truy cập camera', 2000, 'fa-triangle-exclamation');
          cameraActive = false;
        }
      }

      function stopCamera() {
        if (stream) {
          stream.getTracks().forEach(t => t.stop());
          stream = null;
        }
        cameraActive = false;
        gridOverlay.classList.remove('show');
      }

      // ============ Capture ============
      captureBtn.addEventListener('click', async () => {
        if (!cameraActive) {
          await startCamera(currentFacingMode);
          await new Promise(r => setTimeout(r, 600));
          if (!cameraActive) return;
        }
        await captureAndProcess();
      });

      async function captureAndProcess() {
        if (!video.videoWidth) {
          showToast('Camera chưa sẵn sàng', 1500, 'fa-triangle-exclamation');
          return;
        }

        processingOverlay.classList.add('show');
        processingText.textContent = 'Đang phát hiện tài liệu...';

        const srcCanvas = document.createElement('canvas');
        srcCanvas.width = video.videoWidth;
        srcCanvas.height = video.videoHeight;
        srcCanvas.getContext('2d').drawImage(video, 0, 0);
        const originalDataURL = canvasToDataURL(srcCanvas, 0.95);

        try {
          await new Promise(r => setTimeout(r, 50));
          processingText.textContent = autoCropEnabled ? 'Đang cắt viền...' : 'Đang xử lý...';
          const processedCanvas = await processImage(srcCanvas);
          const processedDataURL = canvasToDataURL(processedCanvas, 0.95);

          scannedPages.push({
            id: Date.now() + Math.random(),
            original: originalDataURL,
            processed: processedDataURL
          });

          updateGallery();
          showToast('Đã thêm trang mới', 1200, 'fa-check');
        } catch (e) {
          scannedPages.push({
            id: Date.now() + Math.random(),
            original: originalDataURL,
            processed: originalDataURL
          });
          updateGallery();
          showToast('Đã thêm (cơ bản)', 1500);
        } finally {
          processingOverlay.classList.remove('show');
        }
      }

      // ============ Upload ============
      uploadBtn.addEventListener('click', () => fileInput.click());

      fileInput.addEventListener('change', async (e) => {
        const files = Array.from(e.target.files).filter(f => f.type.startsWith('image/'));
        if (!files.length) return;
        fileInput.value = '';

        processingOverlay.classList.add('show');
        processingText.textContent = `Đang xử lý ${files.length} ảnh...`;

        for (let i = 0; i < files.length; i++) {
          try {
            const dataURL = await new Promise((res, rej) => {
              const r = new FileReader();
              r.onload = ev => res(ev.target.result);
              r.onerror = rej;
              r.readAsDataURL(files[i]);
            });
            const srcCanvas = await dataURLToCanvas(dataURL);
            const processedCanvas = await processImage(srcCanvas);
            const processedDataURL = canvasToDataURL(processedCanvas, 0.95);
            scannedPages.push({
              id: Date.now() + Math.random() + i,
              original: dataURL,
              processed: processedDataURL
            });
          } catch (err) { console.warn(err); }
        }
        updateGallery();
        processingOverlay.classList.remove('show');
        showToast(`Đã thêm ${files.length} ảnh`, 1500, 'fa-check');
      });

      // ============ Switch camera ============
      switchCameraBtn.addEventListener('click', async () => {
        const newMode = currentFacingMode === 'environment' ? 'user' : 'environment';
        await startCamera(newMode);
        showToast(newMode === 'environment' ? 'Camera sau' : 'Camera trước', 1000, 'fa-camera');
      });

      // ============ Modes ============
      autoCropChip.addEventListener('click', () => {
        autoCropEnabled = !autoCropEnabled;
        autoCropChip.classList.toggle('active', autoCropEnabled);
        showToast(autoCropEnabled ? 'Bật tự cắt viền' : 'Tắt tự cắt viền', 1200);
      });

      autoEnhanceChip.addEventListener('click', () => {
        autoEnhanceEnabled = !autoEnhanceEnabled;
        autoEnhanceChip.classList.toggle('active', autoEnhanceEnabled);
        showToast(autoEnhanceEnabled ? 'Bật làm nét' : 'Tắt làm nét', 1200);
      });

      grayChip.addEventListener('click', () => {
        grayEnabled = !grayEnabled;
        grayChip.classList.toggle('active', grayEnabled);
        if (grayEnabled) { bwEnabled = false; bwChip.classList.remove('active'); }
        showToast(grayEnabled ? 'Chế độ xám' : 'Chế độ màu', 1200);
      });

      bwChip.addEventListener('click', () => {
        bwEnabled = !bwEnabled;
        bwChip.classList.toggle('active', bwEnabled);
        if (bwEnabled) { grayEnabled = false; grayChip.classList.remove('active'); }
        showToast(bwEnabled ? 'Chế độ đen trắng' : 'Chế độ màu', 1200);
      });

      // ============ Gallery ============
      function updateGallery() {
        pagesGrid.innerHTML = '';
        if (scannedPages.length === 0) {
          pagesGrid.appendChild(emptyGallery);
          pageCounterBadge.style.display = 'none';
        } else {
          scannedPages.forEach((page, index) => {
            const thumb = document.createElement('div');
            thumb.className = 'page-thumb';

            const img = document.createElement('img');
            img.src = page.processed;
            img.alt = `Trang ${index + 1}`;
            thumb.appendChild(img);

            const overlay = document.createElement('div');
            overlay.className = 'thumb-overlay';
            thumb.appendChild(overlay);

            const idx = document.createElement('div');
            idx.className = 'thumb-index';
            idx.textContent = `#${index + 1}`;
            thumb.appendChild(idx);

            const edit = document.createElement('div');
            edit.className = 'thumb-edit';
            edit.innerHTML = '<i class="fas fa-pen"></i>';
            thumb.appendChild(edit);

            const rm = document.createElement('div');
            rm.className = 'remove-badge';
            rm.innerHTML = '<i class="fas fa-xmark"></i>';
            rm.addEventListener('click', (e) => {
              e.stopPropagation();
              scannedPages = scannedPages.filter(p => p.id !== page.id);
              updateGallery();
              showToast('Đã xoá trang', 1000, 'fa-trash');
            });
            thumb.appendChild(rm);

            thumb.addEventListener('click', () => openPreviewModal(page));
            pagesGrid.appendChild(thumb);
          });
          pageCounterBadge.style.display = 'block';
          counterText.textContent = scannedPages.length;
        }
        pageCountSpan.textContent = `${scannedPages.length} trang`;
      }

      // ============ Modal ============
      async function openPreviewModal(page) {
        currentPreviewPageId = page.id;
        modalImage.src = page.processed;
        modalOverlay.classList.add('show');
        sharpnessSlider.value = 45;
        contrastSlider.value = 30;
        sharpnessValue.textContent = '45';
        contrastValue.textContent = '30';
      }

      function closeModal() {
        modalOverlay.classList.remove('show');
        currentPreviewPageId = null;
      }

      modalCloseBtn.addEventListener('click', closeModal);
      modalCancelBtn.addEventListener('click', closeModal);
      modalOverlay.addEventListener('click', (e) => {
        if (e.target === modalOverlay) closeModal();
      });

      sharpnessSlider.addEventListener('input', (e) => {
        sharpnessValue.textContent = e.target.value;
      });

      contrastSlider.addEventListener('input', (e) => {
        contrastValue.textContent = e.target.value;
      });

      reapplyBtn.addEventListener('click', async () => {
        const page = scannedPages.find(p => p.id === currentPreviewPageId);
        if (!page) return;

        processingOverlay.classList.add('show');
        processingText.textContent = 'Đang tinh chỉnh...';

        const sharp = parseInt(sharpnessSlider.value);
        const contrast = parseInt(contrastSlider.value);

        const srcCanvas = await dataURLToCanvas(page.original);
        const processedCanvas = await processImage(srcCanvas, {
          doCrop: autoCropEnabled,
          doEnhance: true,
          doGray: grayEnabled,
          doBW: bwEnabled,
          sharpness: sharp,
          contrast: contrast
        });

        page.processed = canvasToDataURL(processedCanvas, 0.95);
        updateGallery();
        modalImage.src = page.processed;
        processingOverlay.classList.remove('show');
        showToast('Đã áp dụng tinh chỉnh', 1500, 'fa-wand-magic-sparkles');
      });

      // ============ PDF ============
      async function generatePdf() {
        if (scannedPages.length === 0) {
          showToast('Chưa có trang nào', 1500, 'fa-circle-info');
          return null;
        }
        showToast('Đang tạo PDF...', 1500, 'fa-spinner');
        try {
          const { jsPDF } = window.jspdf;
          const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
          const pw = pdf.internal.pageSize.getWidth();
          const ph = pdf.internal.pageSize.getHeight();
          const margin = 8;
          const maxW = pw - 2 * margin;
          const maxH = ph - 2 * margin;

          for (let i = 0; i < scannedPages.length; i++) {
            if (i > 0) pdf.addPage();
            const dataURL = scannedPages[i].processed;
            const img = await new Promise((res) => {
              const im = new Image();
              im.onload = () => res(im);
              im.onerror = () => res(null);
              im.src = dataURL;
            });
            if (!img) continue;
            const r = Math.min(maxW / img.width, maxH / img.height);
            const w = img.width * r, h = img.height * r;
            pdf.addImage(dataURL, 'JPEG', (pw - w) / 2, (ph - h) / 2, w, h);
          }
          return pdf.output('blob');
        } catch (e) {
          showToast('Lỗi tạo PDF', 1500, 'fa-triangle-exclamation');
          return null;
        }
      }

      exportPdfBtn.addEventListener('click', async () => {
        const blob = await generatePdf();
        if (!blob) return;
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `ScanPro_${Date.now()}.pdf`;
        a.click();
        URL.revokeObjectURL(url);
        showToast('Đã tải PDF', 1800, 'fa-download');
      });

      sharePdfBtn.addEventListener('click', async () => {
        const blob = await generatePdf();
        if (!blob) return;
        const file = new File([blob], `ScanPro_${Date.now()}.pdf`, { type: 'application/pdf' });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({ files: [file], title: 'Tài liệu ScanPro' });
            showToast('Đã chia sẻ', 1500, 'fa-share-nodes');
          } catch (e) {
            if (e.name !== 'AbortError') showToast('Không thể chia sẻ', 1500, 'fa-circle-info');
          }
        } else {
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `ScanPro_${Date.now()}.pdf`;
          a.click();
          URL.revokeObjectURL(url);
          showToast('Đã tải về', 2000, 'fa-download');
        }
      });

      // ============ Settings ============
      settingsBtn.addEventListener('click', () => {
        showToast('Cài đặt đang phát triển', 1500, 'fa-gear');
      });

      // ============ Init ============
      cameraPlaceholder.addEventListener('click', async () => {
        await startCamera(currentFacingMode);
      });

      waitForOpenCV().then(() => {
        if (opencvReady) {
          console.log('✅ OpenCV ready');
          if (cameraActive) scanGuide.classList.add('active');
          autoScanBadge.classList.add('show');
          setTimeout(() => autoScanBadge.classList.remove('show'), 3000);
        }
      });

      window.addEventListener('beforeunload', () => {
        if (stream) stream.getTracks().forEach(t => t.stop());
      });

      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          closeModal();
          stopCamera();
          cameraPlaceholder.style.display = 'flex';
          video.style.display = 'none';
          scanGuide.classList.remove('active');
        }
      });

    })();
  </script>
</body>
</html>
