<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Permissions-Policy" content="camera=*, microphone=*">
  <title>ScanPro A4 • Camera Fixed</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://docs.opencv.org/4.8.0/opencv.js" async></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; }

    :root {
      --primary: #6366f1; --secondary: #8b5cf6; --accent: #06b6d4;
      --success: #10b981; --danger: #f43f5e; --warning: #f59e0b;
      --radius-lg: 28px; --radius-md: 20px; --radius-sm: 14px;
      --shadow-sm: 0 2px 8px -2px rgba(15, 23, 42, 0.08);
    }

    html, body { height: 100%; overflow: hidden; }

    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(ellipse 80% 60% at 50% 0%, #1e1b4b 0%, transparent 60%),
                  radial-gradient(ellipse 60% 50% at 100% 100%, #312e81 0%, transparent 50%),
                  #0a0e1a;
      display: flex; align-items: center; justify-content: center;
      padding: 8px;
    }

    .phone-frame {
      width: 100%; max-width: 410px; height: 880px; max-height: 98vh;
      background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
      border-radius: 52px;
      box-shadow: 0 60px 120px -40px rgba(0, 0, 0, 0.8),
                  0 0 0 2px rgba(255, 255, 255, 0.08) inset,
                  0 0 0 10px rgba(255, 255, 255, 0.02);
      overflow: hidden; display: flex; flex-direction: column; position: relative;
    }

    .dynamic-island {
      position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
      width: 110px; height: 32px; background: #000; border-radius: 20px; z-index: 100;
    }

    .status-bar {
      display: flex; justify-content: space-between;
      padding: 18px 32px 6px; font-size: 14px; font-weight: 700;
      color: #0f172a; z-index: 5; position: relative;
    }

    .status-bar .icons { display: flex; align-items: center; gap: 5px; font-size: 12px; }

    .app-screen {
      flex: 1; overflow-y: auto; padding: 0 18px 30px;
      display: flex; flex-direction: column;
      scrollbar-width: none;
    }

    .app-screen::-webkit-scrollbar { display: none; }

    .header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 6px 2px 14px;
    }

    .logo-group { display: flex; align-items: center; gap: 10px; }

    .logo-mark {
      width: 42px; height: 42px; border-radius: 14px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6, #06b6d4);
      display: flex; align-items: center; justify-content: center;
      color: white; font-size: 19px;
      box-shadow: 0 8px 20px -4px rgba(99, 102, 241, 0.5);
    }

    .brand-text h1 { font-size: 20px; font-weight: 800; color: #0f172a; line-height: 1.1; }
    .brand-text p { font-size: 10px; font-weight: 600; letter-spacing: 0.5px; color: #64748b; text-transform: uppercase; margin-top: 1px; }

    .header-btn {
      width: 42px; height: 42px; border-radius: 14px;
      background: white; border: 1px solid #e2e8f0; color: #334155;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; box-shadow: var(--shadow-sm);
    }

    .capture-card {
      background: linear-gradient(160deg, #ffffff 0%, #f1f5f9 100%);
      border-radius: var(--radius-lg); padding: 12px; margin-bottom: 14px;
      box-shadow: 0 20px 40px -16px rgba(15, 23, 42, 0.18);
      border: 1px solid #e2e8f0;
    }

    .camera-preview {
      width: 100%; aspect-ratio: 3 / 4; background: #0a0e1a;
      border-radius: var(--radius-md); overflow: hidden;
      position: relative; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 24px 40px -20px rgba(0, 0, 0, 0.5);
    }

    /* Video element luôn hiển thị để có thể khởi tạo */
    #videoPreview {
      width: 100%; height: 100%; object-fit: cover;
      display: block; background: #0a0e1a;
      transform: scaleX(-1); /* Chỉ áp dụng cho selfie - sẽ toggle */
    }

    #videoPreview.front-camera {
      transform: scaleX(-1);
    }

    #previewCanvas {
      width: 100%; height: 100%; object-fit: cover;
      display: none; position: absolute; inset: 0;
      background: #0a0e1a;
    }

    .a4-frame {
      position: absolute; inset: 8%;
      border: 3px dashed rgba(255, 255, 255, 0.7);
      border-radius: 12px;
      pointer-events: none; z-index: 3;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.35);
      display: none;
    }

    .a4-frame.show { display: block; }

    .a4-frame::before,
    .a4-frame::after {
      content: ''; position: absolute; width: 30px; height: 30px;
      border: 4px solid #10b981;
    }

    .a4-frame::before {
      top: -4px; left: -4px;
      border-right: none; border-bottom: none;
      border-radius: 12px 0 0 0;
    }

    .a4-frame::after {
      bottom: -4px; right: -4px;
      border-left: none; border-top: none;
      border-radius: 0 0 12px 0;
    }

    .camera-placeholder {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #cbd5e1; gap: 12px;
      background: linear-gradient(160deg, #1e293b, #0f172a);
      z-index: 2; text-align: center; padding: 24px;
      cursor: pointer;
    }

    .camera-placeholder .icon-wrap {
      width: 76px; height: 76px; border-radius: 24px;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
      display: flex; align-items: center; justify-content: center;
      font-size: 32px; color: #818cf8; margin-bottom: 4px;
    }

    .camera-placeholder .main-text { font-size: 15px; font-weight: 700; color: #e2e8f0; }
    .camera-placeholder .hint { font-size: 11.5px; color: #94a3b8; max-width: 240px; line-height: 1.5; }

    .camera-placeholder .tap-btn {
      margin-top: 8px;
      padding: 10px 20px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      border: none;
      border-radius: 30px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 20px -4px rgba(99, 102, 241, 0.5);
    }

    .page-counter-badge {
      position: absolute; top: 14px; right: 14px;
      background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(12px);
      color: white; font-size: 11px; font-weight: 700;
      padding: 6px 12px; border-radius: 30px; z-index: 6;
      border: 1px solid rgba(255,255,255,0.15);
    }

    .processing-overlay {
      position: absolute; inset: 0;
      background: rgba(10, 14, 26, 0.92); backdrop-filter: blur(16px);
      display: none; flex-direction: column; align-items: center; justify-content: center;
      z-index: 10; color: white; gap: 18px; border-radius: var(--radius-md);
    }

    .processing-overlay.show { display: flex; }

    .spinner-wrap { position: relative; width: 60px; height: 60px; }

    .spinner {
      width: 60px; height: 60px;
      border: 3px solid rgba(99, 102, 241, 0.15);
      border-top-color: #6366f1; border-right-color: #8b5cf6;
      border-radius: 50%; animation: spin 0.9s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .processing-overlay span { font-size: 13px; font-weight: 700; color: #e2e8f0; text-align: center; padding: 0 20px; }
    .processing-overlay .hint-small { font-size: 11px; color: #94a3b8; margin-top: -10px; }

    .capture-controls {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 16px; padding: 0 6px;
    }

    .ctrl-btn {
      width: 48px; height: 48px; border-radius: 16px;
      background: white; border: 1px solid #e2e8f0; color: #334155;
      font-size: 17px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; box-shadow: var(--shadow-sm);
      transition: all 0.15s;
    }

    .ctrl-btn:active { transform: scale(0.9); background: #f1f5f9; }

    .shutter-wrap { position: relative; display: flex; align-items: center; justify-content: center; }

    .shutter-ring {
      position: absolute; width: 84px; height: 84px;
      border-radius: 50%; border: 2px solid transparent;
      background: linear-gradient(135deg, #6366f1, #8b5cf6, #06b6d4) border-box;
      -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor; mask-composite: exclude;
      opacity: 0.8;
    }

    .shutter-btn {
      width: 68px; height: 68px; border-radius: 50%;
      background: linear-gradient(145deg, #ffffff, #f1f5f9);
      border: none; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 10px 24px -6px rgba(15, 23, 42, 0.25),
                  0 0 0 4px #ffffff, 0 0 0 5px #e2e8f0;
      cursor: pointer; color: #6366f1; font-size: 26px;
      transition: all 0.15s;
    }

    .shutter-btn:active { transform: scale(0.9); }
    .shutter-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .section-label { padding: 0 4px; margin: 4px 0 10px; }

    .section-label h3 {
      font-size: 13px; font-weight: 800; letter-spacing: 0.5px;
      text-transform: uppercase; color: #64748b;
      display: flex; align-items: center; gap: 6px;
    }

    .section-label h3 i { font-size: 11px; color: #6366f1; }

    .modes-grid {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 8px; margin-bottom: 16px;
    }

    .mode-card {
      background: white; border-radius: var(--radius-sm);
      padding: 10px 6px 9px; display: flex; flex-direction: column;
      align-items: center; gap: 5px;
      border: 1.5px solid #e2e8f0; cursor: pointer;
      transition: all 0.2s; position: relative;
      overflow: hidden; box-shadow: var(--shadow-sm);
    }

    .mode-card.active {
      background: linear-gradient(150deg, #eef2ff, #faf5ff);
      border-color: #a5b4fc;
    }

    .mode-card.active::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, #6366f1, #8b5cf6, #06b6d4);
    }

    .mode-icon {
      width: 30px; height: 30px; border-radius: 10px;
      background: linear-gradient(135deg, #eef2ff, #e0e7ff);
      color: #6366f1; display: flex; align-items: center; justify-content: center;
      font-size: 13px;
    }

    .mode-card.active .mode-icon {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
    }

    .mode-name { font-size: 9.5px; font-weight: 700; color: #475569; text-align: center; line-height: 1.2; }
    .mode-card.active .mode-name { color: #4338ca; }

    .gallery-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 12px; padding: 0 4px;
    }

    .gallery-header h3 {
      font-size: 13px; font-weight: 800; letter-spacing: 0.5px;
      text-transform: uppercase; color: #64748b;
      display: flex; align-items: center; gap: 6px;
    }

    .gallery-header h3 i { font-size: 11px; color: #6366f1; }

    .page-count-badge {
      font-size: 11px; font-weight: 800; color: #4338ca;
      background: linear-gradient(135deg, #eef2ff, #e0e7ff);
      padding: 5px 12px; border-radius: 30px; border: 1px solid #c7d2fe;
    }

    .pages-grid {
      display: flex; gap: 12px; overflow-x: auto;
      padding: 4px 4px 16px; scrollbar-width: none;
      min-height: 130px;
    }

    .pages-grid::-webkit-scrollbar { display: none; }

    .page-thumb {
      flex: 0 0 92px; height: 122px; border-radius: 16px;
      background: #f1f5f9; border: 2px solid white;
      box-shadow: 0 10px 22px -8px rgba(15, 23, 42, 0.25);
      overflow: hidden; position: relative; cursor: pointer;
    }

    .page-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .page-thumb .remove-badge {
      position: absolute; top: 6px; right: 6px;
      background: rgba(255, 255, 255, 0.95);
      width: 24px; height: 24px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; color: #f43f5e;
    }

    .page-thumb .thumb-index {
      position: absolute; bottom: 6px; left: 6px;
      background: rgba(255,255,255,0.95);
      color: #0f172a; font-size: 9.5px; font-weight: 800;
      padding: 3px 7px; border-radius: 8px;
    }

    .empty-gallery {
      color: #94a3b8; font-size: 13px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      width: 100%; height: 122px;
      background: linear-gradient(160deg, #f8fafc, #f1f5f9);
      border-radius: 20px; font-weight: 600;
      border: 2px dashed #cbd5e1; gap: 10px;
    }

    .empty-gallery i { font-size: 28px; color: #cbd5e1; }

    .action-bar { display: flex; gap: 10px; margin-top: 4px; }

    .btn-primary {
      flex: 1.4; background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border: none; border-radius: 20px; padding: 17px 12px;
      color: white; font-weight: 800; font-size: 14px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      box-shadow: 0 16px 32px -10px rgba(99, 102, 241, 0.6);
      cursor: pointer;
    }

    .btn-outline {
      flex: 1; background: white; border: 1.5px solid #e2e8f0;
      border-radius: 20px; padding: 17px 12px;
      color: #1e293b; font-weight: 800; font-size: 14px;
      display: flex; align-items: center; justify-content: center; gap: 7px;
      cursor: pointer;
    }

    .btn-primary:active, .btn-outline:active { transform: scale(0.96); }

    .toast-message {
      position: fixed; bottom: 30px; left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(15, 23, 42, 0.95);
      color: white; font-weight: 600; font-size: 13px;
      padding: 12px 20px; border-radius: 60px;
      z-index: 9999; opacity: 0; transition: all 0.3s;
      pointer-events: none; display: flex; align-items: center; gap: 10px;
      max-width: 90vw;
    }

    .toast-message.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .toast-icon {
      width: 22px; height: 22px; border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; flex-shrink: 0;
    }

    #fileInput { display: none; }

    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(5, 10, 25, 0.85); backdrop-filter: blur(20px);
      z-index: 1000; display: none; align-items: center; justify-content: center;
      padding: 16px;
    }

    .modal-overlay.show { display: flex; }

    .modal-content {
      background: white; border-radius: 28px;
      max-width: 380px; width: 100%; max-height: 92vh;
      overflow: hidden; display: flex; flex-direction: column;
      box-shadow: 0 40px 80px -20px rgba(0, 0, 0, 0.7);
    }

    .modal-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 18px 20px 14px; border-bottom: 1px solid #f1f5f9;
    }

    .modal-header h4 {
      font-size: 15px; font-weight: 800; color: #0f172a;
      display: flex; align-items: center; gap: 8px;
    }

    .modal-header h4 i { color: #6366f1; }

    .modal-header .close-btn {
      background: #f1f5f9; border: none;
      width: 32px; height: 32px; border-radius: 11px;
      color: #334155; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }

    .modal-body { padding: 16px 20px 20px; overflow-y: auto; }

    .modal-body img {
      width: 100%; border-radius: 16px;
      margin-bottom: 16px; border: 1px solid #e2e8f0;
    }

    .modal-actions { display: flex; gap: 10px; margin-top: 8px; }

    .modal-actions button {
      flex: 1; padding: 14px; border-radius: 16px; border: none;
      font-weight: 800; font-size: 13px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 7px;
    }

    .modal-actions .cancel { background: #f1f5f9; color: #334155; }

    @media (max-width: 430px) {
      .phone-frame { height: 100vh; max-height: 100vh; border-radius: 0; }
      body { padding: 0; }
      .dynamic-island { display: none; }
      .status-bar { padding: 14px 22px 4px; }
      .app-screen { padding: 0 14px 30px; }
    }
  </style>
</head>
<body>
  <div class="phone-frame">
    <div class="dynamic-island"></div>

    <div class="status-bar">
      <span class="time">9:41</span>
      <div class="icons">
        <i class="fas fa-signal"></i>
        <i class="fas fa-wifi"></i>
        <i class="fas fa-battery-full"></i>
      </div>
    </div>

    <div class="app-screen">
      <div class="header">
        <div class="logo-group">
          <div class="logo-mark">
            <i class="fas fa-file-contract"></i>
          </div>
          <div class="brand-text">
            <h1>ScanPro A4</h1>
            <p>White Paper Scan</p>
          </div>
        </div>
        <button class="header-btn" id="settingsBtn">
          <i class="fas fa-sliders"></i>
        </button>
      </div>

      <div class="capture-card">
        <div class="camera-preview" id="cameraPreview">
          <!-- Video LUÔN có mặt trong DOM -->
          <video id="videoPreview" autoplay playsinline muted></video>
          <canvas id="previewCanvas"></canvas>
          <div class="a4-frame" id="a4Frame"></div>

          <div class="page-counter-badge" id="pageCounterBadge" style="display:none;">
            <i class="fas fa-file-alt" style="font-size:9px;margin-right:3px;"></i><span id="counterText">0</span>
          </div>

          <div class="camera-placeholder" id="cameraPlaceholder">
            <div class="icon-wrap">
              <i class="fas fa-camera"></i>
            </div>
            <span class="main-text">Nhấn để bật camera</span>
            <span class="hint">Đặt tài liệu vào khung A4, chụp là tự động tách nền trắng</span>
            <button class="tap-btn" id="startCameraBtn">
              <i class="fas fa-camera"></i> BẬT CAMERA
            </button>
          </div>

          <div class="processing-overlay" id="processingOverlay">
            <div class="spinner-wrap">
              <div class="spinner"></div>
            </div>
            <span id="processingText">Đang xử lý...</span>
            <span class="hint-small" id="processingHint">Vui lòng chờ trong giây lát</span>
          </div>
        </div>

        <div class="capture-controls">
          <button class="ctrl-btn" id="switchCameraBtn">
            <i class="fas fa-camera-rotate"></i>
          </button>
          <div class="shutter-wrap">
            <div class="shutter-ring"></div>
            <button class="shutter-btn" id="captureBtn" disabled>
              <i class="fas fa-circle"></i>
            </button>
          </div>
          <button class="ctrl-btn" id="uploadBtn">
            <i class="fas fa-image"></i>
          </button>
        </div>
        <input type="file" id="fileInput" accept="image/*" multiple>
      </div>

      <div class="section-label">
        <h3><i class="fas fa-wand-magic-sparkles"></i> Chế độ xử lý</h3>
      </div>

      <div class="modes-grid">
        <div class="mode-card active" data-mode="auto-white">
          <div class="mode-icon"><i class="fas fa-file"></i></div>
          <div class="mode-name">Nền trắng A4</div>
        </div>
        <div class="mode-card" data-mode="bw">
          <div class="mode-icon"><i class="fas fa-font"></i></div>
          <div class="mode-name">Đen trắng</div>
        </div>
        <div class="mode-card" data-mode="gray">
          <div class="mode-icon"><i class="fas fa-adjust"></i></div>
          <div class="mode-name">Xám</div>
        </div>
        <div class="mode-card" data-mode="magic">
          <div class="mode-icon"><i class="fas fa-wand-sparkles"></i></div>
          <div class="mode-name">Magic Color</div>
        </div>
        <div class="mode-card" data-mode="original">
          <div class="mode-icon"><i class="fas fa-image"></i></div>
          <div class="mode-name">Ảnh gốc</div>
        </div>
        <div class="mode-card" data-mode="high-contrast">
          <div class="mode-icon"><i class="fas fa-sun"></i></div>
          <div class="mode-name">Nét đậm</div>
        </div>
      </div>

      <div class="gallery-header">
        <h3><i class="fas fa-images"></i> Trang đã quét</h3>
        <span class="page-count-badge" id="pageCount">0 trang</span>
      </div>

      <div class="pages-grid" id="pagesGrid">
        <div class="empty-gallery" id="emptyGallery">
          <i class="fas fa-file-circle-plus"></i>
          <span>Chưa có trang nào</span>
        </div>
      </div>

      <div class="action-bar">
        <button class="btn-primary" id="exportPdfBtn">
          <i class="fas fa-file-pdf"></i>
          <span>Xuất PDF</span>
        </button>
        <button class="btn-outline" id="sharePdfBtn">
          <i class="fas fa-share-nodes"></i>
          <span>Chia sẻ</span>
        </button>
      </div>
    </div>
  </div>

  <div class="toast-message" id="toast">
    <div class="toast-icon"><i class="fas fa-check"></i></div>
    <span id="toastText">Thông báo</span>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-content">
      <div class="modal-header">
        <h4><i class="fas fa-eye"></i> Xem trước</h4>
        <button class="close-btn" id="modalCloseBtn"><i class="fas fa-times"></i></button>
      </div>
      <div class="modal-body">
        <img id="modalImage" src="" alt="Preview">
        <div class="modal-actions">
          <button class="cancel" id="modalCancelBtn"><i class="fas fa-xmark"></i> Đóng</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function() {
      'use strict';

      const $ = id => document.getElementById(id);
      const video = $('videoPreview');
      const previewCanvas = $('previewCanvas');
      const a4Frame = $('a4Frame');
      const cameraPlaceholder = $('cameraPlaceholder');
      const captureBtn = $('captureBtn');
      const switchCameraBtn = $('switchCameraBtn');
      const uploadBtn = $('uploadBtn');
      const fileInput = $('fileInput');
      const pagesGrid = $('pagesGrid');
      const emptyGallery = $('emptyGallery');
      const pageCountSpan = $('pageCount');
      const exportPdfBtn = $('exportPdfBtn');
      const sharePdfBtn = $('sharePdfBtn');
      const toastEl = $('toast');
      const toastText = $('toastText');
      const toastIcon = toastEl.querySelector('.toast-icon i');
      const processingOverlay = $('processingOverlay');
      const processingText = $('processingText');
      const processingHint = $('processingHint');
      const pageCounterBadge = $('pageCounterBadge');
      const counterText = $('counterText');
      const startCameraBtn = $('startCameraBtn');

      // ============ STATE ============
      let stream = null;
      let currentFacingMode = 'environment';
      let scannedPages = [];
      let cameraActive = false;
      let opencvReady = false;
      let currentMode = 'auto-white';
      let currentPreviewPageId = null;

      const A4_RATIO = 1.4142;

      // ============ TOAST ============
      function showToast(msg, duration = 1800, iconClass = 'fa-check') {
        toastText.textContent = msg;
        toastIcon.className = `fas ${iconClass}`;
        toastEl.classList.add('show');
        clearTimeout(window.toastTimeout);
        window.toastTimeout = setTimeout(() => toastEl.classList.remove('show'), duration);
      }

      // ============ OPENCV ============
      function waitForOpenCV() {
        return new Promise((resolve) => {
          if (window.cv && window.cv.Mat) { opencvReady = true; resolve(); return; }
          const check = setInterval(() => {
            if (window.cv && window.cv.Mat) {
              opencvReady = true;
              clearInterval(check);
              resolve();
            }
          }, 200);
          setTimeout(() => { clearInterval(check); resolve(); }, 15000);
        });
      }

      // ============ CAMERA - FIXED VERSION ============
      async function startCamera(facingMode = 'environment') {
        console.log('🎥 startCamera called with:', facingMode);

        // Kiểm tra hỗ trợ
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          showToast('Thiết bị không hỗ trợ camera', 3000, 'fa-triangle-exclamation');
          alert('⚠️ Trình duyệt không hỗ trợ camera.\n\nVui lòng:\n1. Mở bằng HTTPS hoặc localhost\n2. Dùng Chrome/Safari mới\n3. Không mở file:// trực tiếp');
          return;
        }

        // Dừng stream cũ
        if (stream) {
          stream.getTracks().forEach(t => t.stop());
          stream = null;
        }

        try {
          // Constraints đơn giản hơn để tương thích rộng
          const constraints = {
            video: {
              facingMode: { ideal: facingMode },
              width: { ideal: 1920, min: 640 },
              height: { ideal: 1080, min: 480 }
            },
            audio: false
          };

          console.log('📞 Requesting getUserMedia...');
          stream = await navigator.mediaDevices.getUserMedia(constraints);
          console.log('✅ Got stream:', stream.getVideoTracks()[0].label);

          // Gán stream vào video
          video.srcObject = stream;

          // Chờ video sẵn sàng
          await new Promise((resolve, reject) => {
            video.onloadedmetadata = () => {
              video.play().then(resolve).catch(reject);
            };
            video.onerror = reject;
            // Timeout fallback
            setTimeout(resolve, 3000);
          });

          // Đợi thêm để video render
          await new Promise(r => setTimeout(r, 300));

          cameraActive = true;
          cameraPlaceholder.style.display = 'none';
          a4Frame.classList.add('show');
          captureBtn.disabled = false;
          currentFacingMode = facingMode;

          // Xử lý mirror cho camera trước
          if (facingMode === 'user') {
            video.classList.add('front-camera');
          } else {
            video.classList.remove('front-camera');
          }

          showToast('✓ Camera đã bật', 1500, 'fa-camera');
          console.log('✅ Camera fully active');
        } catch (err) {
          console.error('❌ Camera error:', err);
          cameraActive = false;
          captureBtn.disabled = true;
          
          let errorMsg = 'Không thể truy cập camera';
          if (err.name === 'NotAllowedError') {
            errorMsg = 'Bạn đã từ chối quyền camera. Vui lòng cấp lại quyền.';
          } else if (err.name === 'NotFoundError') {
            errorMsg = 'Không tìm thấy camera trên thiết bị.';
          } else if (err.name === 'NotReadableError') {
            errorMsg = 'Camera đang được dùng bởi ứng dụng khác.';
          } else if (err.name === 'OverconstrainedError') {
            errorMsg = 'Camera không hỗ trợ cấu hình yêu cầu.';
          }
          
          showToast(errorMsg, 3000, 'fa-triangle-exclamation');
          
          // Hiển thị hướng dẫn
          cameraPlaceholder.innerHTML = `
            <div class="icon-wrap" style="background: rgba(244, 63, 94, 0.15); border-color: rgba(244, 63, 94, 0.3); color: #f43f5e;">
              <i class="fas fa-exclamation-triangle"></i>
            </div>
            <span class="main-text" style="color: #f43f5e;">Lỗi Camera</span>
            <span class="hint">${errorMsg}</span>
            <span class="hint" style="color: #fbbf24; font-weight: 600; margin-top: 8px;">
              💡 Lưu ý: Phải mở trang bằng HTTPS hoặc localhost
            </span>
            <button class="tap-btn" onclick="location.reload()">
              <i class="fas fa-redo"></i> THỬ LẠI
            </button>
          `;
        }
      }

      function stopCamera() {
        if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
        cameraActive = false;
        captureBtn.disabled = true;
        a4Frame.classList.remove('show');
      }

      // ============ SORT CORNERS ============
      function sortCorners(pts) {
        const sorted = [...pts];
        const sum = sorted.map(p => p.x + p.y);
        const diff = sorted.map(p => p.x - p.y);
        const tl = sorted[sum.indexOf(Math.min(...sum))];
        const br = sorted[sum.indexOf(Math.max(...sum))];
        const tr = sorted[diff.indexOf(Math.max(...diff))];
        const bl = sorted[diff.indexOf(Math.min(...diff))];
        return [tl, tr, br, bl];
      }

      // ==================================================
      //  SCAN NỘI DUNG VÀ ĐẶT LÊN NỀN A4 TRẮNG
      // ==================================================
      async function scanToWhiteA4(srcCanvas) {
        if (!opencvReady) return srcCanvas;

        try {
          const src = cv.imread(srcCanvas);
          const W = src.cols, H = src.rows;

          const gray = new cv.Mat();
          cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);

          // Tách vùng giấy bằng adaptive threshold
          const docMask = new cv.Mat();
          cv.adaptiveThreshold(gray, docMask, 255, cv.ADAPTIVE_THRESH_GAUSSIAN_C, cv.THRESH_BINARY, 51, -10);
          
          const kernel = cv.Mat.ones(15, 15, cv.CV_8U);
          cv.morphologyEx(docMask, docMask, cv.MORPH_CLOSE, kernel, new cv.Point(-1, -1), 3);
          cv.morphologyEx(docMask, docMask, cv.MORPH_OPEN, kernel, new cv.Point(-1, -1), 1);
          kernel.delete();

          const contours = new cv.MatVector();
          const hierarchy = new cv.Mat();
          cv.findContours(docMask, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

          let maxArea = 0, bestIdx = -1;
          const imgArea = W * H;
          for (let i = 0; i < contours.size(); i++) {
            const area = cv.contourArea(contours.get(i));
            if (area > maxArea && area > imgArea * 0.15) {
              maxArea = area;
              bestIdx = i;
            }
          }

          let corners = [
            { x: 0, y: 0 },
            { x: W - 1, y: 0 },
            { x: W - 1, y: H - 1 },
            { x: 0, y: H - 1 }
          ];

          if (bestIdx >= 0) {
            const cnt = contours.get(bestIdx);
            const peri = cv.arcLength(cnt, true);
            const approx = new cv.Mat();
            cv.approxPolyDP(cnt, approx, 0.02 * peri, true);

            if (approx.rows === 4) {
              const pts = [];
              for (let j = 0; j < 4; j++) {
                pts.push({ x: approx.data32S[j * 2], y: approx.data32S[j * 2 + 1] });
              }
              corners = sortCorners(pts);
            }
            approx.delete();
            cnt.delete();
          }

          contours.delete(); hierarchy.delete(); docMask.delete();

          const [tl, tr, br, bl] = corners;
          const widthTop = Math.hypot(tr.x - tl.x, tr.y - tl.y);
          const widthBottom = Math.hypot(br.x - bl.x, br.y - bl.y);
          const heightLeft = Math.hypot(bl.x - tl.x, bl.y - tl.y);
          const heightRight = Math.hypot(br.x - tr.x, br.y - tr.y);

          let warpedW = Math.round(Math.max(widthTop, widthBottom));
          let warpedH = Math.round(Math.max(heightLeft, heightRight));

          const actualRatio = warpedH / warpedW;
          if (actualRatio < A4_RATIO) {
            warpedH = Math.round(warpedW * A4_RATIO);
          } else {
            warpedW = Math.round(warpedH / A4_RATIO);
          }

          warpedW = Math.max(warpedW, 600);
          warpedH = Math.max(warpedH, 850);

          const srcTri = cv.matFromArray(4, 1, cv.CV_32FC2, [tl.x, tl.y, tr.x, tr.y, br.x, br.y, bl.x, bl.y]);
          const dstTri = cv.matFromArray(4, 1, cv.CV_32FC2, [0, 0, warpedW - 1, 0, warpedW - 1, warpedH - 1, 0, warpedH - 1]);
          const M = cv.getPerspectiveTransform(srcTri, dstTri);
          const warped = new cv.Mat();
          cv.warpPerspective(src, warped, M, new cv.Size(warpedW, warpedH),
                             cv.INTER_LINEAR, cv.BORDER_CONSTANT, new cv.Scalar(255, 255, 255, 255));

          srcTri.delete(); dstTri.delete(); M.delete();

          const warpedGray = new cv.Mat();
          cv.cvtColor(warped, warpedGray, cv.COLOR_RGBA2GRAY);

          const thresh = new cv.Mat();
          cv.threshold(warpedGray, thresh, 0, 255, cv.THRESH_BINARY + cv.THRESH_OTSU);

          const whitePixels = cv.countNonZero(thresh);
          const totalPixels = thresh.rows * thresh.cols;
          if (whitePixels < totalPixels * 0.3) {
            cv.bitwise_not(thresh, thresh);
          }

          const smallKernel = cv.Mat.ones(2, 2, cv.CV_8U);
          cv.morphologyEx(thresh, thresh, cv.MORPH_OPEN, smallKernel);
          smallKernel.delete();

          const a4White = new cv.Mat(warpedH, warpedW, cv.CV_8UC4, new cv.Scalar(255, 255, 255, 255));
          const contentMask = new cv.Mat();
          cv.bitwise_not(thresh, contentMask);
          const result = a4White.clone();
          warped.copyTo(result, contentMask);

          contentMask.delete();
          thresh.delete();
          warpedGray.delete();
          warped.delete();
          gray.delete();
          a4White.delete();
          src.delete();

          const resultGray = new cv.Mat();
          cv.cvtColor(result, resultGray, cv.COLOR_RGBA2GRAY);

          const clahe = new cv.CLAHE(2.5, new cv.Size(8, 8));
          clahe.apply(resultGray, resultGray);

          const blurred = new cv.Mat();
          cv.GaussianBlur(resultGray, blurred, new cv.Size(5, 5), 0);
          const sharpened = new cv.Mat();
          cv.addWeighted(resultGray, 1.6, blurred, -0.6, 0, sharpened);

          cv.cvtColor(sharpened, result, cv.COLOR_GRAY2RGBA);

          const alpha = new cv.Mat(result.rows, result.cols, cv.CV_8UC1, new cv.Scalar(255));
          const channels = new cv.MatVector();
          cv.split(result, channels);
          channels.set(3, alpha);
          cv.merge(channels, result);

          alpha.delete(); channels.delete();
          resultGray.delete(); blurred.delete(); sharpened.delete(); clahe.delete();

          const out = document.createElement('canvas');
          out.width = result.cols;
          out.height = result.rows;
          cv.imshow(out, result);
          result.delete();

          return out;
        } catch (e) {
          console.error('scanToWhiteA4 error:', e);
          return srcCanvas;
        }
      }

      // ============ PROCESS BY MODE ============
      async function processByMode(srcCanvas, mode) {
        if (!opencvReady) return srcCanvas;

        try {
          if (mode === 'original') return srcCanvas;
          if (mode === 'auto-white') return await scanToWhiteA4(srcCanvas);

          let canvas = srcCanvas;
          if (mode === 'bw' || mode === 'gray' || mode === 'magic' || mode === 'high-contrast') {
            canvas = await scanToWhiteA4(srcCanvas);
          }

          const mat = cv.imread(canvas);
          const gray = new cv.Mat();
          cv.cvtColor(mat, gray, cv.COLOR_RGBA2GRAY);

          if (mode === 'bw') {
            const bw = new cv.Mat();
            cv.adaptiveThreshold(gray, bw, 255, cv.ADAPTIVE_THRESH_GAUSSIAN_C, cv.THRESH_BINARY, 15, 8);
            cv.cvtColor(bw, bw, cv.COLOR_GRAY2RGBA);
            const out = document.createElement('canvas');
            out.width = bw.cols; out.height = bw.rows;
            cv.imshow(out, bw);
            mat.delete(); gray.delete(); bw.delete();
            return out;
          }

          if (mode === 'gray') {
            const out = document.createElement('canvas');
            out.width = gray.cols; out.height = gray.rows;
            cv.imshow(out, gray);
            mat.delete(); gray.delete();
            return out;
          }

          if (mode === 'magic') {
            const lab = new cv.Mat();
            cv.cvtColor(mat, lab, cv.COLOR_RGBA2RGB);
            cv.cvtColor(lab, lab, cv.COLOR_RGB2Lab);
            const channels = new cv.MatVector();
            cv.split(lab, channels);
            const clahe = new cv.CLAHE(4.0, new cv.Size(8, 8));
            const l = channels.get(0);
            clahe.apply(l, l);
            channels.set(0, l);
            cv.merge(channels, lab);
            const result = new cv.Mat();
            cv.cvtColor(lab, result, cv.COLOR_Lab2RGB);
            cv.cvtColor(result, result, cv.COLOR_RGB2RGBA);
            const out = document.createElement('canvas');
            out.width = result.cols; out.height = result.rows;
            cv.imshow(out, result);
            mat.delete(); gray.delete(); lab.delete(); channels.delete(); l.delete(); clahe.delete(); result.delete();
            return out;
          }

          if (mode === 'high-contrast') {
            const thresh = new cv.Mat();
            cv.threshold(gray, thresh, 0, 255, cv.THRESH_BINARY + cv.THRESH_OTSU);
            const blurred = new cv.Mat();
            cv.GaussianBlur(thresh, blurred, new cv.Size(3, 3), 0);
            const sharp = new cv.Mat();
            cv.addWeighted(thresh, 2.0, blurred, -1.0, 0, sharp);
            cv.cvtColor(sharp, sharp, cv.COLOR_GRAY2RGBA);
            const out = document.createElement('canvas');
            out.width = sharp.cols; out.height = sharp.rows;
            cv.imshow(out, sharp);
            mat.delete(); gray.delete(); thresh.delete(); blurred.delete(); sharp.delete();
            return out;
          }

          mat.delete(); gray.delete();
          return canvas;
        } catch (e) {
          console.error('processByMode error:', e);
          return srcCanvas;
        }
      }

      // ============ EVENT LISTENERS ============

      // Nút bật camera riêng
      startCameraBtn.addEventListener('click', async (e) => {
        e.stopPropagation();
        await startCamera(currentFacingMode);
      });

      // Click vào placeholder cũng bật camera
      cameraPlaceholder.addEventListener('click', async (e) => {
        if (e.target.tagName !== 'BUTTON') {
          await startCamera(currentFacingMode);
        }
      });

      // Nút chụp
      captureBtn.addEventListener('click', async () => {
        if (!cameraActive) {
          showToast('Camera chưa bật', 1500, 'fa-camera');
          return;
        }
        await captureAndProcess();
      });

      async function captureAndProcess() {
        if (!video.videoWidth) {
          showToast('Camera chưa sẵn sàng', 1500, 'fa-triangle-exclamation');
          return;
        }

        processingOverlay.classList.add('show');
        processingText.textContent = 'Đang chụp...';
        processingHint.textContent = 'Vui lòng giữ yên máy';

        const srcCanvas = document.createElement('canvas');
        srcCanvas.width = video.videoWidth;
        srcCanvas.height = video.videoHeight;
        const ctx = srcCanvas.getContext('2d');

        // Nếu camera trước, lật lại cho đúng
        if (currentFacingMode === 'user') {
          ctx.translate(srcCanvas.width, 0);
          ctx.scale(-1, 1);
        }
        ctx.drawImage(video, 0, 0);

        // Flash effect
        previewCanvas.style.display = 'block';
        previewCanvas.width = video.videoWidth;
        previewCanvas.height = video.videoHeight;
        previewCanvas.getContext('2d').drawImage(srcCanvas, 0, 0);
        video.style.visibility = 'hidden';
        setTimeout(() => {
          previewCanvas.style.display = 'none';
          if (cameraActive) video.style.visibility = 'visible';
        }, 150);

        const originalDataURL = srcCanvas.toDataURL('image/jpeg', 0.95);

        try {
          processingText.textContent = 'Đang tách nền trắng A4...';
          processingHint.textContent = 'Nhận diện nội dung và làm sạch';
          await new Promise(r => setTimeout(r, 100));

          const processedCanvas = await processByMode(srcCanvas, currentMode);
          const processedDataURL = canvasToDataURL(processedCanvas, 0.95);

          scannedPages.push({
            id: Date.now() + Math.random(),
            original: originalDataURL,
            processed: processedDataURL,
            mode: currentMode
          });
          updateGallery();
          showToast('✓ Đã thêm trang nền trắng A4', 1500, 'fa-check');
        } catch (e) {
          console.error(e);
          scannedPages.push({
            id: Date.now() + Math.random(),
            original: originalDataURL,
            processed: originalDataURL,
            mode: 'original'
          });
          updateGallery();
          showToast('Đã thêm (cơ bản)', 1500);
        } finally {
          processingOverlay.classList.remove('show');
        }
      }

      // Helper: canvas to dataURL
      function canvasToDataURL(canvas, quality = 0.95) {
        return canvas.toDataURL('image/jpeg', quality);
      }

      // Upload
      uploadBtn.addEventListener('click', () => fileInput.click());

      fileInput.addEventListener('change', async (e) => {
        const files = Array.from(e.target.files).filter(f => f.type.startsWith('image/'));
        if (!files.length) return;
        fileInput.value = '';

        processingOverlay.classList.add('show');
        processingText.textContent = `Đang xử lý ${files.length} ảnh...`;
        processingHint.textContent = 'Chuyển sang nền trắng A4';

        for (let i = 0; i < files.length; i++) {
          try {
            processingText.textContent = `Đang xử lý ${i + 1}/${files.length}...`;
            const dataURL = await new Promise((res, rej) => {
              const r = new FileReader();
              r.onload = ev => res(ev.target.result);
              r.onerror = rej;
              r.readAsDataURL(files[i]);
            });
            const srcCanvas = await dataURLToCanvas(dataURL);
            const processedCanvas = await processByMode(srcCanvas, currentMode);
            const processedDataURL = canvasToDataURL(processedCanvas, 0.95);
            scannedPages.push({
              id: Date.now() + Math.random() + i,
              original: dataURL,
              processed: processedDataURL,
              mode: currentMode
            });
          } catch (err) { console.warn(err); }
        }
        updateGallery();
        processingOverlay.classList.remove('show');
        showToast(`✓ Đã thêm ${files.length} ảnh nền A4`, 1500, 'fa-check');
      });

      function dataURLToCanvas(dataURL) {
        return new Promise((resolve) => {
          const img = new Image();
          img.onload = () => {
            const c = document.createElement('canvas');
            c.width = img.width; c.height = img.height;
            c.getContext('2d').drawImage(img, 0, 0);
            resolve(c);
          };
          img.src = dataURL;
        });
      }

      // Switch camera
      switchCameraBtn.addEventListener('click', async () => {
        if (!cameraActive) {
          showToast('Bật camera trước', 1500, 'fa-camera');
          return;
        }
        const newMode = currentFacingMode === 'environment' ? 'user' : 'environment';
        await startCamera(newMode);
        showToast(newMode === 'environment' ? 'Camera sau' : 'Camera trước', 1000, 'fa-camera');
      });

      // Mode selector
      document.querySelectorAll('.mode-card').forEach(card => {
        card.addEventListener('click', () => {
          document.querySelectorAll('.mode-card').forEach(c => c.classList.remove('active'));
          card.classList.add('active');
          currentMode = card.dataset.mode;
          const names = {
            'auto-white': 'Nền trắng A4',
            'bw': 'Đen trắng',
            'gray': 'Xám',
            'magic': 'Magic Color',
            'original': 'Ảnh gốc',
            'high-contrast': 'Nét đậm'
          };
          showToast(`Chế độ: ${names[currentMode]}`, 1200, 'fa-wand-magic-sparkles');
        });
      });

      // Gallery
      function updateGallery() {
        pagesGrid.innerHTML = '';
        if (scannedPages.length === 0) {
          pagesGrid.appendChild(emptyGallery);
          pageCounterBadge.style.display = 'none';
        } else {
          scannedPages.forEach((page, index) => {
            const thumb = document.createElement('div');
            thumb.className = 'page-thumb';

            const img = document.createElement('img');
            img.src = page.processed;
            thumb.appendChild(img);

            const idx = document.createElement('div');
            idx.className = 'thumb-index';
            idx.textContent = `#${index + 1}`;
            thumb.appendChild(idx);

            const rm = document.createElement('div');
            rm.className = 'remove-badge';
            rm.innerHTML = '<i class="fas fa-xmark"></i>';
            rm.addEventListener('click', (e) => {
              e.stopPropagation();
              scannedPages = scannedPages.filter(p => p.id !== page.id);
              updateGallery();
              showToast('Đã xoá trang', 1000, 'fa-trash');
            });
            thumb.appendChild(rm);

            thumb.addEventListener('click', () => openPreviewModal(page));
            pagesGrid.appendChild(thumb);
          });
          pageCounterBadge.style.display = 'block';
          counterText.textContent = scannedPages.length;
        }
        pageCountSpan.textContent = `${scannedPages.length} trang`;
      }

      // Modal
      const modalOverlay = $('modalOverlay');
      const modalImage = $('modalImage');

      function openPreviewModal(page) {
        currentPreviewPageId = page.id;
        modalImage.src = page.processed;
        modalOverlay.classList.add('show');
      }

      function closeModal() {
        modalOverlay.classList.remove('show');
        currentPreviewPageId = null;
      }

      $('modalCloseBtn').addEventListener('click', closeModal);
      $('modalCancelBtn').addEventListener('click', closeModal);
      modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) closeModal(); });

      // PDF
      async function generatePdf() {
        if (scannedPages.length === 0) {
          showToast('Chưa có trang nào', 1500, 'fa-circle-info');
          return null;
        }
        showToast('Đang tạo PDF...', 1500, 'fa-spinner');
        try {
          const { jsPDF } = window.jspdf;
          const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
          const pw = pdf.internal.pageSize.getWidth();
          const ph = pdf.internal.pageSize.getHeight();

          for (let i = 0; i < scannedPages.length; i++) {
            if (i > 0) pdf.addPage();
            const dataURL = scannedPages[i].processed;
            const img = await new Promise((res) => {
              const im = new Image();
              im.onload = () => res(im);
              im.onerror = () => res(null);
              im.src = dataURL;
            });
            if (!img) continue;
            const r = Math.min(pw / img.width, ph / img.height);
            const w = img.width * r, h = img.height * r;
            pdf.addImage(dataURL, 'JPEG', (pw - w) / 2, (ph - h) / 2, w, h);
          }
          return pdf.output('blob');
        } catch (e) {
          showToast('Lỗi tạo PDF', 1500, 'fa-triangle-exclamation');
          return null;
        }
      }

      exportPdfBtn.addEventListener('click', async () => {
        const blob = await generatePdf();
        if (!blob) return;
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = `ScanPro_${Date.now()}.pdf`; a.click();
        URL.revokeObjectURL(url);
        showToast('✓ Đã tải PDF', 1800, 'fa-download');
      });

      sharePdfBtn.addEventListener('click', async () => {
        const blob = await generatePdf();
        if (!blob) return;
        const file = new File([blob], `ScanPro_${Date.now()}.pdf`, { type: 'application/pdf' });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({ files: [file], title: 'Tài liệu ScanPro' });
            showToast('Đã chia sẻ', 1500, 'fa-share-nodes');
          } catch (e) {
            if (e.name !== 'AbortError') showToast('Không thể chia sẻ', 1500, 'fa-circle-info');
          }
        } else {
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url; a.download = `ScanPro_${Date.now()}.pdf`; a.click();
          URL.revokeObjectURL(url);
          showToast('Đã tải về', 2000, 'fa-download');
        }
      });

      $('settingsBtn').addEventListener('click', () => {
        showToast('Cài đặt đang phát triển', 1500, 'fa-gear');
      });

      // ============ INIT ============
      waitForOpenCV().then(() => {
        if (opencvReady) {
          console.log('✅ OpenCV ready');
        } else {
          console.warn('⚠️ OpenCV not ready - chạy chế độ cơ bản');
        }
      });

      window.addEventListener('beforeunload', () => {
        if (stream) stream.getTracks().forEach(t => t.stop());
      });

      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          closeModal();
        }
      });

      updateGallery();

      // Check protocol ngay khi load
      if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1' && location.protocol !== 'file:') {
        setTimeout(() => {
          showToast('⚠️ Cần HTTPS để dùng camera', 4000, 'fa-triangle-exclamation');
        }, 1000);
      }

      if (location.protocol === 'file:') {
        setTimeout(() => {
          showToast('⚠️ Không mở file:// — cần HTTPS', 5000, 'fa-triangle-exclamation');
        }, 1000);
      }

      console.log('🚀 ScanPro initialized. Protocol:', location.protocol);

    })();
  </script>
</body>
</html>
