<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ScanPro AI • Smart Paper Detection</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://docs.opencv.org/4.8.0/opencv.js" async></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --primary-light: #818cf8;
      --secondary: #8b5cf6;
      --accent: #06b6d4;
      --success: #10b981;
      --success-dark: #059669;
      --danger: #f43f5e;
      --warning: #f59e0b;
      --dark: #0a0e1a;
      --dark-2: #131828;
      --gray-1: #f8fafc;
      --gray-2: #f1f5f9;
      --gray-3: #e2e8f0;
      --gray-5: #64748b;
      --gray-7: #334155;
      --radius-lg: 28px;
      --radius-md: 20px;
      --radius-sm: 14px;
      --shadow-sm: 0 2px 8px -2px rgba(15, 23, 42, 0.08);
      --shadow-md: 0 8px 24px -8px rgba(15, 23, 42, 0.15);
      --shadow-lg: 0 20px 40px -16px rgba(15, 23, 42, 0.22);
      --shadow-glow: 0 12px 32px -8px rgba(99, 102, 241, 0.4);
      --shadow-glow-success: 0 12px 32px -8px rgba(16, 185, 129, 0.5);
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: 
        radial-gradient(ellipse 80% 60% at 50% 0%, #1e1b4b 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 100% 100%, #312e81 0%, transparent 50%),
        radial-gradient(ellipse 60% 50% at 0% 100%, #0e7490 0%, transparent 50%),
        #0a0e1a;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    /* ============ PHONE FRAME ============ */
    .phone-frame {
      width: 100%;
      max-width: 410px;
      height: 860px;
      max-height: 97vh;
      background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
      border-radius: 52px;
      box-shadow:
        0 60px 120px -40px rgba(0, 0, 0, 0.8),
        0 0 0 2px rgba(255, 255, 255, 0.08) inset,
        0 0 0 10px rgba(255, 255, 255, 0.02),
        0 0 0 11px rgba(255, 255, 255, 0.05);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 1;
    }

    .dynamic-island {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 110px;
      height: 32px;
      background: #000;
      border-radius: 20px;
      z-index: 100;
      box-shadow: 0 0 0 2px rgba(255,255,255,0.05);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 10px;
    }

    .dynamic-island::after {
      content: '';
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #1e3a5f, #0a0e1a);
      box-shadow: 0 0 0 1px rgba(255,255,255,0.1), inset 0 0 4px rgba(96, 165, 250, 0.4);
    }

    /* ============ STATUS BAR ============ */
    .status-bar {
      display: flex;
      justify-content: space-between;
      padding: 18px 32px 6px;
      font-size: 14px;
      font-weight: 700;
      color: #0f172a;
      background: transparent;
      letter-spacing: -0.2px;
      z-index: 5;
      position: relative;
    }

    .status-bar .time { font-feature-settings: "tnum"; }

    .status-bar .icons {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
    }

    .status-bar .icons i { color: #0f172a; }

    /* ============ APP SCREEN ============ */
    .app-screen {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 0 18px 20px;
      display: flex;
      flex-direction: column;
      scrollbar-width: none;
      -ms-overflow-style: none;
      scroll-behavior: smooth;
    }

    .app-screen::-webkit-scrollbar { display: none; }

    /* ============ HEADER ============ */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 2px 14px;
      animation: slideDown 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .logo-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-mark {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6, #06b6d4);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 19px;
      box-shadow: 0 8px 20px -4px rgba(99, 102, 241, 0.5), inset 0 1px 0 rgba(255,255,255,0.3);
      position: relative;
      overflow: hidden;
    }

    .logo-mark::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, transparent 40%, rgba(255,255,255,0.2) 100%);
    }

    .logo-mark i { position: relative; z-index: 1; }

    .brand-text h1 {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #0f172a;
      line-height: 1.1;
    }

    .brand-text p {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #64748b;
      text-transform: uppercase;
      margin-top: 1px;
    }

    .header-btn {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: white;
      border: 1px solid #e2e8f0;
      color: #334155;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: var(--shadow-sm);
    }

    .header-btn:active {
      transform: scale(0.92);
      background: var(--gray-2);
    }

    /* ============ CAPTURE CARD ============ */
    .capture-card {
      background: linear-gradient(160deg, #ffffff 0%, #f1f5f9 100%);
      border-radius: var(--radius-lg);
      padding: 12px;
      margin-bottom: 16px;
      box-shadow: 
        0 20px 40px -16px rgba(15, 23, 42, 0.18),
        0 0 0 1px rgba(226, 232, 240, 0.8) inset;
      border: 1px solid #e2e8f0;
      position: relative;
      animation: fadeUp 0.5s 0.1s cubic-bezier(0.4, 0, 0.2, 1) backwards;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .camera-preview {
      width: 100%;
      aspect-ratio: 3 / 4;
      background: #0a0e1a;
      border-radius: var(--radius-md);
      overflow: hidden;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 24px 40px -20px rgba(0, 0, 0, 0.5);
    }

    #videoPreview, #previewCanvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #0a0e1a;
    }

    #previewCanvas { display: none; }

    /* ============ DETECTION OVERLAY ============ */
    #detectionCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
      display: none;
    }

    .grid-overlay {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      opacity: 0.25;
      background-image: 
        linear-gradient(rgba(255,255,255,0.2) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.2) 1px, transparent 1px);
      background-size: 33.33% 33.33%;
      display: none;
    }

    .grid-overlay.show { display: block; }

    .camera-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #cbd5e1;
      font-size: 14px;
      font-weight: 500;
      gap: 12px;
      background: linear-gradient(160deg, #1e293b, #0f172a);
      z-index: 2;
      text-align: center;
      padding: 24px;
    }

    .camera-placeholder .icon-wrap {
      width: 76px;
      height: 76px;
      border-radius: 24px;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      color: #818cf8;
      margin-bottom: 4px;
      backdrop-filter: blur(8px);
    }

    .camera-placeholder .main-text {
      font-size: 15px;
      font-weight: 700;
      color: #e2e8f0;
      letter-spacing: -0.2px;
    }

    .camera-placeholder .hint {
      font-size: 11.5px;
      color: #94a3b8;
      font-weight: 500;
      max-width: 240px;
      line-height: 1.5;
    }

    /* ============ SMART STATUS BADGES ============ */
    .status-badge {
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 6;
      font-size: 10px;
      font-weight: 800;
      padding: 7px 13px;
      border-radius: 30px;
      display: none;
      align-items: center;
      gap: 7px;
      letter-spacing: 0.7px;
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.2);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      text-transform: uppercase;
      box-shadow: 0 8px 20px -6px rgba(0,0,0,0.4);
    }

    .status-badge.show { display: flex; }

    .status-badge .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.6); }
    }

    .status-badge.searching {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.95), rgba(217, 119, 6, 0.95));
      color: white;
    }

    .status-badge.detected {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.95), rgba(139, 92, 246, 0.95));
      color: white;
      animation: bounceIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .status-badge.locked {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.95), rgba(5, 150, 105, 0.95));
      color: white;
      box-shadow: 0 8px 24px -6px rgba(16, 185, 129, 0.6);
      animation: bounceIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @keyframes bounceIn {
      0% { transform: scale(0.85); opacity: 0; }
      60% { transform: scale(1.05); opacity: 1; }
      100% { transform: scale(1); }
    }

    /* ============ STABILITY METER ============ */
    .stability-meter {
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      width: 70%;
      height: 6px;
      background: rgba(255,255,255,0.15);
      border-radius: 10px;
      overflow: hidden;
      z-index: 6;
      display: none;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.1);
    }

    .stability-meter.show { display: block; }

    .stability-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #f59e0b, #10b981);
      border-radius: 10px;
      transition: width 0.15s linear;
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.8);
    }

    /* ============ CORNER DETECTION MARKERS ============ */
    .corner-marker {
      position: absolute;
      width: 24px;
      height: 24px;
      border: 3px solid #6366f1;
      z-index: 6;
      display: none;
      pointer-events: none;
      filter: drop-shadow(0 0 6px rgba(99, 102, 241, 0.9));
      transition: all 0.1s linear;
    }

    .corner-marker.show { display: block; }

    .corner-marker.tl { border-right: none; border-bottom: none; border-radius: 8px 0 0 0; }
    .corner-marker.tr { border-left: none; border-bottom: none; border-radius: 0 8px 0 0; }
    .corner-marker.bl { border-right: none; border-top: none; border-radius: 0 0 0 8px; }
    .corner-marker.br { border-left: none; border-top: none; border-radius: 0 0 8px 0; }

    /* ============ PAGE COUNTER ============ */
    .page-counter-badge {
      position: absolute;
      top: 14px;
      right: 14px;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      color: white;
      font-size: 11px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 30px;
      z-index: 6;
      border: 1px solid rgba(255,255,255,0.15);
      letter-spacing: 0.3px;
    }

    /* ============ PROCESSING OVERLAY ============ */
    .processing-overlay {
      position: absolute;
      inset: 0;
      background: rgba(10, 14, 26, 0.9);
      backdrop-filter: blur(16px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      color: white;
      gap: 18px;
      border-radius: var(--radius-md);
    }

    .processing-overlay.show { display: flex; }

    .spinner-wrap {
      position: relative;
      width: 60px;
      height: 60px;
    }

    .spinner {
      width: 60px;
      height: 60px;
      border: 3px solid rgba(99, 102, 241, 0.15);
      border-top-color: #6366f1;
      border-right-color: #8b5cf6;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    .spinner-inner {
      position: absolute;
      inset: 12px;
      border: 2px solid rgba(6, 182, 212, 0.15);
      border-bottom-color: #06b6d4;
      border-radius: 50%;
      animation: spin 1.4s linear infinite reverse;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .processing-overlay span {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.3px;
      color: #e2e8f0;
    }

    /* ============ CAPTURE CONTROLS ============ */
    .capture-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 16px;
      padding: 0 6px;
    }

    .ctrl-btn {
      width: 48px;
      height: 48px;
      border-radius: 16px;
      background: white;
      border: 1px solid #e2e8f0;
      color: #334155;
      font-size: 17px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: var(--shadow-sm);
      position: relative;
    }

    .ctrl-btn:active {
      transform: scale(0.9);
      background: var(--gray-2);
    }

    .ctrl-btn.active {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      border-color: transparent;
      box-shadow: var(--shadow-glow);
    }

    .shutter-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .shutter-ring {
      position: absolute;
      width: 84px;
      height: 84px;
      border-radius: 50%;
      border: 2px solid transparent;
      background: linear-gradient(135deg, #6366f1, #8b5cf6, #06b6d4) border-box;
      -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      animation: rotateRing 6s linear infinite;
      opacity: 0.6;
    }

    .shutter-ring.auto-active {
      animation: rotateRing 1.5s linear infinite;
      opacity: 1;
    }

    @keyframes rotateRing {
      to { transform: rotate(360deg); }
    }

    .shutter-btn {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: linear-gradient(145deg, #ffffff, #f1f5f9);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 
        0 10px 24px -6px rgba(15, 23, 42, 0.25),
        0 0 0 4px #ffffff,
        0 0 0 5px #e2e8f0,
        inset 0 1px 2px rgba(255,255,255,1);
      transition: all 0.15s;
      cursor: pointer;
      color: #6366f1;
      font-size: 26px;
      position: relative;
    }

    .shutter-btn:active {
      transform: scale(0.9);
      box-shadow: 
        0 6px 16px -4px rgba(15, 23, 42, 0.3),
        0 0 0 4px #ffffff,
        0 0 0 5px #818cf8;
    }

    .shutter-btn::after {
      content: '';
      position: absolute;
      inset: 6px;
      border-radius: 50%;
      border: 2px solid #e2e8f0;
      opacity: 0.6;
    }

    .shutter-btn.locked {
      color: #10b981;
      box-shadow: 
        0 10px 24px -6px rgba(16, 185, 129, 0.4),
        0 0 0 4px #ffffff,
        0 0 0 5px #34d399,
        inset 0 1px 2px rgba(255,255,255,1);
    }

    /* ============ AUTO SCAN TOGGLE ============ */
    .auto-toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: linear-gradient(160deg, #eef2ff, #e0e7ff);
      border-radius: 14px;
      margin-bottom: 14px;
      border: 1px solid #c7d2fe;
      animation: fadeUp 0.5s 0.15s cubic-bezier(0.4, 0, 0.2, 1) backwards;
    }

    .auto-toggle-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .auto-toggle-icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      box-shadow: 0 6px 14px -4px rgba(99, 102, 241, 0.5);
    }

    .auto-toggle-text .title {
      font-size: 12px;
      font-weight: 800;
      color: #3730a3;
      letter-spacing: -0.1px;
    }

    .auto-toggle-text .sub {
      font-size: 10px;
      font-weight: 500;
      color: #6366f1;
      margin-top: 1px;
    }

    .toggle-switch {
      width: 46px;
      height: 26px;
      border-radius: 20px;
      background: #cbd5e1;
      position: relative;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      flex-shrink: 0;
    }

    .toggle-switch::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: white;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
    }

    .toggle-switch.on {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      box-shadow: 0 4px 12px -2px rgba(99, 102, 241, 0.6);
    }

    .toggle-switch.on::after {
      left: 23px;
    }

    /* ============ SENSITIVITY ROW ============ */
    .sensitivity-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      background: #f8fafc;
      border-radius: 12px;
      margin-bottom: 14px;
      border: 1px solid #e2e8f0;
      animation: fadeUp 0.5s 0.2s cubic-bezier(0.4, 0, 0.2, 1) backwards;
    }

    .sensitivity-row label {
      font-size: 11px;
      font-weight: 700;
      color: #64748b;
      letter-spacing: 0.2px;
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }

    .sensitivity-row label i {
      color: #6366f1;
      font-size: 10px;
    }

    .sensitivity-row input[type=range] {
      flex: 1;
      height: 4px;
      border-radius: 10px;
      background: linear-gradient(90deg, #c7d2fe, #6366f1);
      outline: none;
      -webkit-appearance: none;
      appearance: none;
      cursor: pointer;
    }

    .sensitivity-row input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: white;
      border: 2.5px solid #6366f1;
      box-shadow: 0 3px 8px -2px rgba(99, 102, 241, 0.5);
      cursor: pointer;
    }

    .sensitivity-row input[type=range]::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: white;
      border: 2.5px solid #6366f1;
      cursor: pointer;
    }

    .sensitivity-value {
      font-size: 10.5px;
      font-weight: 800;
      color: #4338ca;
      background: #eef2ff;
      padding: 3px 8px;
      border-radius: 7px;
      min-width: 32px;
      text-align: center;
    }

    /* ============ SECTION LABELS ============ */
    .section-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4px;

      const toastText = document.getElementById('toastText');
      const toastIcon = toastEl.querySelector('.toast-icon i');
      const gridOverlay = document.getElementById('gridOverlay');
      const processingOverlay = document.getElementById('processingOverlay');
      const processingText = document.getElementById('processingText');
      const pageCounterBadge = document.getElementById('pageCounterBadge');
      const counterText = document.getElementById('counterText');
      const settingsBtn = document.getElementById('settingsBtn');

      const statusBadge = document.getElementById('statusBadge');
      const statusText = document.getElementById('statusText');
      const stabilityMeter = document.getElementById('stabilityMeter');
      const stabilityFill = document.getElementById('stabilityFill');
      const shutterRing = document.getElementById('shutterRing');

      const markerTL = document.getElementById('markerTL');
      const markerTR = document.getElementById('markerTR');
      const markerBL = document.getElementById('markerBL');
      const markerBR = document.getElementById('markerBR');

      const autoToggle = document.getElementById('autoToggle');
      const sensitivitySlider = document.getElementById('sensitivitySlider');
      const sensitivityValue = document.getElementById('sensitivityValue');
      const sensitivityRow = document.getElementById('sensitivityRow');

      const autoCropChip = document.getElementById('autoCropChip');
      const autoEnhanceChip = document.getElementById('autoEnhanceChip');
      const grayChip = document.getElementById('grayChip');
      const bwChip = document.getElementById('bwChip');

      const modalOverlay = document.getElementById('modalOverlay');
      const modalImage = document.getElementById('modalImage');
      const modalCloseBtn = document.getElementById('modalCloseBtn');
      const modalCancelBtn = document.getElementById('modalCancelBtn');
      const reapplyBtn = document.getElementById('reapplyBtn');
      const sharpnessSlider = document.getElementById('sharpnessSlider');
      const contrastSlider = document.getElementById('contrastSlider');
      const sharpnessValue = document.getElementById('sharpnessValue');
      const contrastValue = document.getElementById('contrastValue');

      // ============ State ============
      let stream = null;
      let currentFacingMode = 'environment';
      let scannedPages = [];
      let cameraActive = false;
      let opencvReady = false;
      let autoCropEnabled = true;
      let autoEnhanceEnabled = true;
      let grayEnabled = false;
      let bwEnabled = false;
      let currentPreviewPageId = null;

      // === Smart detection state ===
      let autoScanEnabled = true;
      let sensitivity = 65;
      let detectionLoopId = null;
      let lastDetectedCorners = null;
      let stabilityFrames = 0;
      let lastCornerKey = '';
      let lastCaptureTime = 0;
      const MIN_CAPTURE_INTERVAL = 3500; // ms giữa các lần auto-chụp
      const STABILITY_THRESHOLD = 15; // số frame ổn định để chụp

      // ============ Toast ============
      function showToast(msg, duration = 1800, iconClass = 'fa-check') {
        toastText.textContent = msg;
        toastIcon.className = `fas ${iconClass}`;
        toastEl.classList.add('show');
        clearTimeout(window.toastTimeout);
        window.toastTimeout = setTimeout(() => toastEl.classList.remove('show'), duration);
      }

      // ============ OpenCV ============
      function waitForOpenCV() {
        return new Promise((resolve) => {
          if (window.cv && window.cv.Mat) { opencvReady = true; resolve(); return; }
          const check = setInterval(() => {
            if (window.cv && window.cv.Mat) {
              opencvReady = true;
              clearInterval(check);
              resolve();
            }
          }, 200);
          setTimeout(() => { clearInterval(check); resolve(); }, 8000);
        });
      }

      // ============ REAL-TIME DETECTION ============
      // Phát hiện 4 góc giấy trong frame hiện tại (dùng video frame nhỏ để nhanh)
      function detectDocumentLive() {
        if (!opencvReady || !cameraActive) return null;
        if (!video.videoWidth || !video.videoHeight) return null;

        try {
          // Downscale xuống 320px để detect nhanh
          const scale = 320 / video.videoWidth;
          const w = 320;
          const h = Math.round(video.videoHeight * scale);

          const tmpCanvas = document.createElement('canvas');
          tmpCanvas.width = w;
          tmpCanvas.height = h;
          tmpCanvas.getContext('2d').drawImage(video, 0, 0, w, h);

          const src = cv.imread(tmpCanvas);
          const gray = new cv.Mat();
          const blurred = new cv.Mat();
          const edges = new cv.Mat();
          const contours = new cv.MatVector();
          const hierarchy = new cv.Mat();

          cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
          cv.GaussianBlur(gray, blurred, new cv.Size(5, 5), 0, 0, cv.BORDER_DEFAULT);
          cv.Canny(blurred, edges, 50, 150);
          cv.dilate(edges, edges, cv.Mat.ones(3, 3, cv.CV_8U), new cv.Point(-1, -1), 1);
          cv.findContours(edges, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

          let maxArea = 0;
          let bestCorners = null;
          const imgArea = w * h;

          for (let i = 0; i < contours.size(); i++) {
            const cnt = contours.get(i);
            const area = cv.contourArea(cnt);
            if (area > maxArea && area > imgArea * 0.12) {
              const peri = cv.arcLength(cnt, true);
              const approx = new cv.Mat();
              cv.approxPolyDP(cnt, approx, 0.02 * peri, true);
              if (approx.rows === 4 && cv.isContourConvex(approx)) {
                maxArea = area;
                const pts = [];
                for (let j = 0; j < 4; j++) {
                  pts.push({
                    x: approx.data32S[j * 2] / scale,
                    y: approx.data32S[j * 2 + 1] / scale
                  });
                }
                bestCorners = sortCorners(pts);
              }
              approx.delete();
            }
            cnt.delete();
          }

          src.delete(); gray.delete(); blurred.delete(); edges.delete();
          contours.delete(); hierarchy.delete();
          return bestCorners;
        } catch (e) {
          return null;
        }
      }

      function sortCorners(pts) {
        const sorted = [...pts];
        const sum = sorted.map(p => p.x + p.y);
        const diff = sorted.map(p => p.x - p.y);
        const tl = sorted[sum.indexOf(Math.min(...sum))];
        const br = sorted[sum.indexOf(Math.max(...sum))];
        const tr = sorted[diff.indexOf(Math.max(...diff))];
        const bl = sorted[diff.indexOf(Math.min(...diff))];
        return [tl, tr, br, bl];
      }

      // ============ STABILITY CHECK ============
      function cornersKey(corners) {
        if (!corners) return '';
        return corners.map(c => `${Math.round(c.x / 8)},${Math.round(c.y / 8)}`).join('|');
      }

      // ============ DETECTION LOOP ============
      function startDetectionLoop() {
        stopDetectionLoop();
        detectionLoopId = setInterval(() => {
          if (!cameraActive) return;

          const corners = detectDocumentLive();
          lastDetectedCorners = corners;

          if (corners) {
            // Cập nhật vị trí markers
            updateCornerMarkers(corners);

            // Kiểm tra ổn định
            const key = cornersKey(corners);
            if (key === lastCornerKey) {
              stabilityFrames++;
            } else {
              stabilityFrames = 0;
              lastCornerKey = key;
            }

            // Cập nhật thanh stability
            const stabilityPercent = Math.min(100, (stabilityFrames / STABILITY_THRESHOLD) * 100);
            stabilityFill.style.width = stabilityPercent + '%';

            // Cập nhật status badge
            if (stabilityFrames >= STABILITY_THRESHOLD) {
              setStatusBadge('locked', 'LOCKED');
              shutterRing.classList.add('auto-active');
              captureBtn.classList.add('locked');

              // Auto capture!
              if (autoScanEnabled && Date.now() - lastCaptureTime > MIN_CAPTURE_INTERVAL) {
                lastCaptureTime = Date.now();
                autoCapture();
              }
            } else {
              setStatusBadge('detected', 'DETECTED');
              shutterRing.classList.remove('auto-active');
              captureBtn.classList.remove('locked');
            }
          } else {
            // Không phát hiện - reset
            stabilityFrames = 0;
            lastCornerKey = '';
            hideCornerMarkers();
            setStatusBadge('searching', 'SEARCHING');
            stabilityFill.style.width = '0%';
            shutterRing.classList.remove('auto-active');
            captureBtn.classList.remove('locked');
          }
        }, 120); // ~8fps detection
      }

      function stopDetectionLoop() {
        if (detectionLoopId) {
          clearInterval(detectionLoopId);
          detectionLoopId = null;
        }
        stabilityFrames = 0;
        lastCornerKey = '';
        stabilityFill.style.width = '0%';
        hideCornerMarkers();
      }

      function setStatusBadge(type, text) {
        statusBadge.className = 'status-badge show ' + type;
        statusText.textContent = text;
      }

      function updateCornerMarkers(corners) {
        // Convert video coords -> preview element coords
        const rect = video.getBoundingClientRect();
        const parentRect = video.parentElement.getBoundingClientRect();
        const offsetX = rect.left - parentRect.left;
        const offsetY = rect.top - parentRect.top;

        const vw = video.videoWidth;
        const vh = video.videoHeight;
        const displayW = rect.width;
        const displayH = rect.height;

        // Vì video object-fit: cover, cần tính tỉ lệ
        const videoAspect = vw / vh;
        const displayAspect = displayW / displayH;
        let scaleX, scaleY, cropX = 0, cropY = 0;

        if (videoAspect > displayAspect) {
          // video rộng hơn -> crop 2 bên
          scaleY = displayH / vh;
          scaleX = scaleY;
          cropX = (vw * scaleX - displayW) / 2;
        } else {
          scaleX = displayW / vw;
          scaleY = scaleX;
          cropY = (vh * scaleY - displayH) / 2;
        }

        const transform = (pt) => ({
          x: offsetX + pt.x * scaleX - cropX,
          y: offsetY + pt.y * scaleY - cropY
        });

        const [tl, tr, br, bl] = corners.map(transform);

        setMarker(markerTL, tl.x - 4, tl.y - 4);
        setMarker(markerTR, tr.x - 20, tr.y - 4);
        setMarker(markerBL, bl.x - 4, bl.y - 20);
        setMarker(markerBR, br.x - 20, br.y - 20);
      }

      function setMarker(el, x, y) {
        el.style.left = x + 'px';
        el.style.top = y + 'px';
        el.classList.add('show');
      }

      function hideCornerMarkers() {
        markerTL.classList.remove('show');
        markerTR.classList.remove('show');
        markerBL.classList.remove('show');
        markerBR.classList.remove('show');
      }

      // ============ IMAGE PROCESSING ============
      function detectDocumentCorners(srcCanvas) {
        if (!opencvReady) return null;
        try {
          const src = cv.imread(srcCanvas);
          const gray = new cv.Mat();
          const blurred = new cv.Mat();
          const edges = new cv.Mat();
          const contours = new cv.MatVector();
          const hierarchy = new cv.Mat();

          cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
          cv.GaussianBlur(gray, blurred, new cv.Size(5, 5), 0, 0, cv.BORDER_DEFAULT);
          cv.Canny(blurred, edges, 60, 180);
          cv.dilate(edges, edges, cv.Mat.ones(3, 3, cv.CV_8U), new cv.Point(-1, -1), 1);
          cv.findContours(edges, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

          let maxArea = 0, bestCorners = null;
          const imgArea = srcCanvas.width * srcCanvas.height;

          for (let i = 0; i < contours.size(); i++) {
            const cnt = contours.get(i);
            const area = cv.contourArea(cnt);
            if (area > maxArea && area > imgArea * 0.15) {
              const peri = cv.arcLength(cnt, true);
              const approx = new cv.Mat();
              cv.approxPolyDP(cnt, approx, 0.02 * peri, true);
              if (approx.rows === 4 && cv.isContourConvex(approx)) {
                maxArea = area;
                const pts = [];
                for (let j = 0; j < 4; j++) {
                  pts.push({ x: approx.data32S[j * 2], y: approx.data32S[j * 2 + 1] });
                }
                bestCorners = sortCorners(pts);
              }
              approx.delete();
            }
            cnt.delete();
          }

          src.delete(); gray.delete(); blurred.delete(); edges.delete();
          contours.delete(); hierarchy.delete();
          return bestCorners;
        } catch (e) { return null; }
      }

      function warpPerspective(srcCanvas, corners) {
        if (!opencvReady || !corners) return null;
        try {
          const src = cv.imread(srcCanvas);
          const [tl, tr, br, bl] = corners;
          const widthTop = Math.hypot(tr.x - tl.x, tr.y - tl.y);
          const widthBottom = Math.hypot(br.x - bl.x, br.y - bl.y);
          const heightLeft = Math.hypot(bl.x - tl.x, bl.y - tl.y);
          const heightRight = Math.hypot(br.x - tr.x, br.y - tr.y);
          const maxWidth = Math.max(widthTop, widthBottom);
          const maxHeight = Math.max(heightLeft, heightRight);

          const srcTri = cv.matFromArray(4, 1, cv.CV_32FC2, [tl.x, tl.y, tr.x, tr.y, br.x, br.y, bl.x, bl.y]);
          const dstTri = cv.matFromArray(4, 1, cv.CV_32FC2, [0, 0, maxWidth - 1, 0, maxWidth - 1, maxHeight - 1, 0, maxHeight - 1]);
          const M = cv.getPerspectiveTransform(srcTri, dstTri);
          const dst = new cv.Mat();
          const dsize = new cv.Size(Math.round(maxWidth), Math.round(maxHeight));
          cv.warpPerspective(src, dst, M, dsize, cv.INTER_LINEAR, cv.BORDER_CONSTANT, new cv.Scalar());

          const outCanvas = document.createElement('canvas');
          outCanvas.width = dst.cols;
          outCanvas.height = dst.rows;
          cv.imshow(outCanvas, dst);

          src.delete(); srcTri.delete(); dstTri.delete(); M.delete(); dst.delete();
          return outCanvas;
        } catch (e) { return null; }
      }

      function enhanceImage(srcCanvas, sharpness = 45, contrast = 30) {
        if (!opencvReady) return srcCanvas;
        try {
          const src = cv.imread(srcCanvas);
          let enhanced = new cv.Mat();

          if (contrast > 0) {
            const lab = new cv.Mat();
            cv.cvtColor(src, lab, cv.COLOR_RGBA2RGB);
            cv.cvtColor(lab, lab, cv.COLOR_RGB2Lab);
            const channels = new cv.MatVector();
            cv.split(lab, channels);
            const clahe = new cv.CLAHE(2.0 + contrast / 40, new cv.Size(8, 8));
            const l = channels.get(0);
            clahe.apply(l, l);
            channels.set(0, l);
            cv.merge(channels, lab);
            cv.cvtColor(lab, enhanced, cv.COLOR_Lab2RGB);
            cv.cvtColor(enhanced, enhanced, cv.COLOR_RGB2RGBA);
            lab.delete(); channels.delete(); l.delete();
          } else {
            src.copyTo(enhanced);
          }

          if (sharpness > 0) {
            const blurred = new cv.Mat();
            const sharp = new cv.Mat();
            cv.GaussianBlur(enhanced, blurred, new cv.Size(5, 5), 0, 0);
            const amount = sharpness / 100 * 1.5;
            cv.addWeighted(enhanced, 1 + amount, blurred, -amount, 0, sharp);
            enhanced.delete();
            enhanced = sharp;
            blurred.delete();
          }

          const out = document.createElement('canvas');
          out.width = enhanced.cols;
          out.height = enhanced.rows;
          cv.imshow(out, enhanced);
          src.delete(); enhanced.delete();
          return out;
        } catch (e) { return srcCanvas; }
      }

      function applyColorMode(srcCanvas, gray, bw) {
        if (!opencvReady || (!gray && !bw)) return srcCanvas;
        try {
          const src = cv.imread(srcCanvas);
          const grayMat = new cv.Mat();
          cv.cvtColor(src, grayMat, cv.COLOR_RGBA2GRAY);
          let result = new cv.Mat();
          if (bw) {
            cv.adaptiveThreshold(grayMat, result, 255, cv.ADAPTIVE_THRESH_GAUSSIAN_C, cv.THRESH_BINARY, 15, 8);
          } else {
            grayMat.copyTo(result);
          }
          cv.cvtColor(result, result, cv.COLOR_GRAY2RGBA);
          const out = document.createElement('canvas');
          out.width = result.cols;
          out.height = result.rows;
          cv.imshow(out, result);
          src.delete(); grayMat.delete(); result.delete();
          return out;
        } catch (e) { return srcCanvas; }
      }

      async function processImage(srcCanvas, options = {}) {
        const {
          doCrop = autoCropEnabled,
          doEnhance = autoEnhanceEnabled,
          doGray = grayEnabled,
          doBW = bwEnabled,
          sharpness = 45,
          contrast = 30
        } = options;

        let currentCanvas = srcCanvas;
        if (doCrop && opencvReady) {
          const corners = detectDocumentCorners(currentCanvas);
          if (corners) {
            const warped = warpPerspective(currentCanvas, corners);
            if (warped) currentCanvas = warped;
          }
        }
        if (doEnhance && opencvReady) {
          currentCanvas = enhanceImage(currentCanvas, sharpness, contrast);
        }
        if ((doGray || doBW) && opencvReady) {
          currentCanvas = applyColorMode(currentCanvas, doGray, doBW);
        }
        return currentCanvas;
      }

      function canvasToDataURL(canvas, quality = 0.95) {
        return canvas.toDataURL('image/jpeg', quality);
      }

      function dataURLToCanvas(dataURL) {
        return new Promise((resolve) => {
          const img = new Image();
          img.onload = () => {
            const c = document.createElement('canvas');
            c.width = img.width;
            c.height = img.height;
            c.getContext('2d').drawImage(img, 0, 0);
            resolve(c);
          };
          img.src = dataURL;
        });
      }

      // ============ Camera ============
      async function startCamera(facingMode = 'environment') {
        if (stream) {
          stream.getTracks().forEach(t => t.stop());
          stream = null;
        }
        try {
          stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode, width: { ideal: 1920 }, height: { ideal: 1080 } },
            audio: false
          });
          video.srcObject = stream;
          await video.play();
          cameraActive = true;
          cameraPlaceholder.style.display = 'none';
          video.style.display = 'block';
          previewCanvas.style.display = 'none';
          gridOverlay.classList.add('show');
          currentFacingMode = facingMode;

          // Đợi OpenCV rồi bật detection
          if (opencvReady) {
            setStatusBadge('searching', 'SEARCHING');
            startDetectionLoop();
          } else {
            waitForOpenCV().then(() => {
              setStatusBadge('searching', 'SEARCHING');
              startDetectionLoop();
            });
          }
        } catch (err) {
          showToast('Không thể truy cập camera', 2000, 'fa-triangle-exclamation');
          cameraActive = false;
        }
      }

      function stopCamera() {
        if (stream) {
          stream.getTracks().forEach(t => t.stop());
          stream = null;
        }
        cameraActive = false;
        gridOverlay.classList.remove('show');
        stopDetectionLoop();
        statusBadge.classList.remove('show');
        stabilityMeter.classList.remove('show');
      }

      // ============ CAPTURE ============
      captureBtn.addEventListener('click', async () => {
        if (!cameraActive) {
          await startCamera(currentFacingMode);
          return;
        }
        await captureAndProcess();
      });

      async function autoCapture() {
        if (processingOverlay.classList.contains('show')) return;
        // Flash effect
        previewCanvas.style.display = 'block';
        previewCanvas.width = video.videoWidth;
        previewCanvas.height = video.videoHeight;
        previewCanvas.getContext('2d').drawImage(video, 0, 0);
        video.style.display = 'none';
        setTimeout(() => {
          previewCanvas.style.display = 'none';
          if (cameraActive) video.style.display = 'block';
        }, 180);

        await captureAndProcess(true);
      }

      async function captureAndProcess(isAuto = false) {
        if (!video.videoWidth) return;

        processingOverlay.classList.add('show');
        processingText.textContent = 'Đang xử lý tài liệu...';

        const srcCanvas = document.createElement('canvas');
        srcCanvas.width = video.videoWidth;
        srcCanvas.height = video.videoHeight;
        srcCanvas.getContext('2d').drawImage(video, 0, 0);
        const originalDataURL = canvasToDataURL(srcCanvas, 0.95);

        try {
          await new Promise(r => setTimeout(r, 50));
          processingText.textContent = autoCropEnabled ? 'Đang cắt viền & làm phẳng...' : 'Đang xử lý...';
          const processedCanvas = await processImage(srcCanvas);
          const processedDataURL = canvasToDataURL(processedCanvas, 0.95);

          scannedPages.push({
            id: Date.now() + Math.random(),
            original: originalDataURL,
            processed: processedDataURL
          });

          updateGallery();
          showToast(isAuto ? '⚡ Auto chụp thành công' : 'Đã thêm trang mới', 1400, 'fa-check');
        } catch (e) {
          scannedPages.push({
            id: Date.now() + Math.random(),
            original: originalDataURL,
            processed: originalDataURL
          });
          updateGallery();
          showToast('Đã thêm (cơ bản)', 1500);
        } finally {
          processingOverlay.classList.remove('show');
          // Reset detection sau khi chụp để tránh chụp liên tục
          stabilityFrames = 0;
          lastCornerKey = '';
          lastCaptureTime = Date.now();
        }
      }

      // ============ Upload ============
      uploadBtn.addEventListener('click', () => fileInput.click());

      fileInput.addEventListener('change', async (e) => {
        const files = Array.from(e.target.files).filter(f => f.type.startsWith('image/'));
        if (!files.length) return;
        fileInput.value = '';

        processingOverlay.classList.add('show');
        processingText.textContent = `Đang xử lý ${files.length} ảnh...`;

        for (let i = 0; i < files.length; i++) {
          try {
            const dataURL = await new Promise((res, rej) => {
              const r = new FileReader();
              r.onload = ev => res(ev.target.result);
              r.onerror = rej;
              r.readAsDataURL(files[i]);
            });
            const srcCanvas = await dataURLToCanvas(dataURL);
            const processedCanvas = await processImage(srcCanvas);
            const processedDataURL = canvasToDataURL(processedCanvas, 0.95);
            scannedPages.push({
              id: Date.now() + Math.random() + i,
              original: dataURL,
              processed: processedDataURL
            });
          } catch (err) { console.warn(err); }
        }
        updateGallery();
        processingOverlay.classList.remove('show');
        showToast(`Đã thêm ${files.length} ảnh`, 1500, 'fa-check');
      });

      // ============ Switch camera ============
      switchCameraBtn.addEventListener('click', async () => {
        const newMode = currentFacingMode === 'environment' ? 'user' : 'environment';
        await startCamera(newMode);
        showToast(newMode === 'environment' ? 'Camera sau' : 'Camera trước', 1000, 'fa-camera');
      });

      // ============ Auto scan toggle ============
      autoToggle.addEventListener('click', () => {
        autoScanEnabled = !autoScanEnabled;
        autoToggle.classList.toggle('on', autoScanEnabled);
        sensitivityRow.style.display = autoScanEnabled ? 'flex' : 'none';
        if (autoScanEnabled && cameraActive) {
          setStatusBadge('searching', 'SEARCHING');
          stabilityMeter.classList.add('show');
        } else {
          stabilityMeter.classList.remove('show');
        }
        showToast(autoScanEnabled ? '⚡ Bật tự động chụp' : 'Tắt tự động chụp', 1400, autoScanEnabled ? 'fa-bolt' : 'fa-pause');
      });

      sensitivitySlider.addEventListener('input', (e) => {
        sensitivity = parseInt(e.target.value);
        sensitivityValue.textContent = sensitivity;
      });

      // ============ Modes ============
      autoCropChip.addEventListener('click', () => {
        autoCropEnabled = !autoCropEnabled;
        autoCropChip.classList.toggle('active', autoCropEnabled);
        showToast(autoCropEnabled ? 'Bật tự cắt viền' : 'Tắt tự cắt viền', 1200);
      });

      autoEnhanceChip.addEventListener('click', () => {
        autoEnhanceEnabled = !autoEnhanceEnabled;
        autoEnhanceChip.classList.toggle('active', autoEnhanceEnabled);
        showToast(autoEnhanceEnabled ? 'Bật làm nét' : 'Tắt làm nét', 1200);
      });

      grayChip.addEventListener('click', () => {
        grayEnabled = !grayEnabled;
        grayChip.classList.toggle('active', grayEnabled);
        if (grayEnabled) { bwEnabled = false; bwChip.classList.remove('active'); }
        showToast(grayEnabled ? 'Chế độ xám' : 'Chế độ màu', 1200);
      });

      bwChip.addEventListener('click', () => {
        bwEnabled = !bwEnabled;
        bwChip.classList.toggle('active', bwEnabled);
        if (bwEnabled) { grayEnabled = false; grayChip.classList.remove('active'); }
        showToast(bwEnabled ? 'Chế độ đen trắng' : 'Chế độ màu', 1200);
      });

      // ============ Gallery ============
      function updateGallery() {
        pagesGrid.innerHTML = '';
        if (scannedPages.length === 0) {
          pagesGrid.appendChild(emptyGallery);
          pageCounterBadge.style.display = 'none';
        } else {
          scannedPages.forEach((page, index) => {
            const thumb = document.createElement('div');
            thumb.className = 'page-thumb';

            const img = document.createElement('img');
            img.src = page.processed;
            img.alt = `Trang ${index + 1}`;
            thumb.appendChild(img);

            const overlay = document.createElement('div');
            overlay.className = 'thumb-overlay';
            thumb.appendChild(overlay);

            const idx = document.createElement('div');
            idx.className = 'thumb-index';
            idx.textContent = `#${index + 1}`;
            thumb.appendChild(idx);

            const edit = document.createElement('div');
            edit.className = 'thumb-edit';
            edit.innerHTML = '<i class="fas fa-pen"></i>';
            thumb.appendChild(edit);

            const rm = document.createElement('div');
            rm.className = 'remove-badge';
            rm.innerHTML = '<i class="fas fa-xmark"></i>';
            rm.addEventListener('click', (e) => {
              e.stopPropagation();
              scannedPages = scannedPages.filter(p => p.id !== page.id);
              updateGallery();
              showToast('Đã xoá trang', 1000, 'fa-trash');
            });
            thumb.appendChild(rm);

            thumb.addEventListener('click', () => openPreviewModal(page));
            pagesGrid.appendChild(thumb);
          });
          pageCounterBadge.style.display = 'block';
          counterText.textContent = scannedPages.length;
        }
        pageCountSpan.textContent = `${scannedPages.length} trang`;
      }

      // ============ Modal ============
      async function openPreviewModal(page) {
        currentPreviewPageId = page.id;
        modalImage.src = page.processed;
        modalOverlay.classList.add('show');
        sharpnessSlider.value = 45;
        contrastSlider.value = 30;
        sharpnessValue.textContent = '45';
        contrastValue.textContent = '30';
      }

      function closeModal() {
        modalOverlay.classList.remove('show');
        currentPreviewPageId = null;
      }

      modalCloseBtn.addEventListener('click', closeModal);
      modalCancelBtn.addEventListener('click', closeModal);
      modalOverlay.addEventListener('click', (e) => {
        if (e.target === modalOverlay) closeModal();
      });

      sharpnessSlider.addEventListener('input', (e) => {
        sharpnessValue.textContent = e.target.value;
      });

      contrastSlider.addEventListener('input', (e) => {
        contrastValue.textContent = e.target.value;
      });

      reapplyBtn.addEventListener('click', async () => {
        const page = scannedPages.find(p => p.id === currentPreviewPageId);
        if (!page) return;

        processingOverlay.classList.add('show');
        processingText.textContent = 'Đang tinh chỉnh...';

        const sharp = parseInt(sharpnessSlider.value);
        const contrast = parseInt(contrastSlider.value);

        const srcCanvas = await dataURLToCanvas(page.original);
        const processedCanvas = await processImage(srcCanvas, {
          doCrop: autoCropEnabled,
          doEnhance: true,
          doGray: grayEnabled,
          doBW: bwEnabled,
          sharpness: sharp,
          contrast: contrast
        });

        page.processed = canvasToDataURL(processedCanvas, 0.95);
        updateGallery();
        modalImage.src = page.processed;
        processingOverlay.classList.remove('show');
        showToast('Đã áp dụng tinh chỉnh', 1500, 'fa-wand-magic-sparkles');
      });

      // ============ PDF ============
      async function generatePdf() {
        if (scannedPages.length === 0) {
          showToast('Chưa có trang nào', 1500, 'fa-circle-info');
          return null;
        }
        showToast('Đang tạo PDF...', 1500, 'fa-spinner');
        try {
          const { jsPDF } = window.jspdf;
          const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
          const pw = pdf.internal.pageSize.getWidth();
          const ph = pdf.internal.pageSize.getHeight();
          const margin = 8;
          const maxW = pw - 2 * margin;
          const maxH = ph - 2 * margin;

          for (let i = 0; i < scannedPages.length; i++) {
            if (i > 0) pdf.addPage();
            const dataURL = scannedPages[i].processed;
            const img = await new Promise((res) => {
              const im = new Image();
              im.onload = () => res(im);
              im.onerror = () => res(null);
              im.src = dataURL;
            });
            if (!img) continue;
            const r = Math.min(maxW / img.width, maxH / img.height);
            const w = img.width * r, h = img.height * r;
            pdf.addImage(dataURL, 'JPEG', (pw - w) / 2, (ph - h) / 2, w, h);
          }
          return pdf.output('blob');
        } catch (e) {
          showToast('Lỗi tạo PDF', 1500, 'fa-triangle-exclamation');
          return null;
        }
      }

      exportPdfBtn.addEventListener('click', async () => {
        const blob = await generatePdf();
        if (!blob) return;
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `ScanPro_${Date.now()}.pdf`;
        a.click();
        URL.revokeObjectURL(url);
        showToast('Đã tải PDF', 1800, 'fa-download');
      });

      sharePdfBtn.addEventListener('click', async () => {
        const blob = await generatePdf();
        if (!blob) return;
        const file = new File([blob], `ScanPro_${Date.now()}.pdf`, { type: 'application/pdf' });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({ files: [file], title: 'Tài liệu ScanPro' });
            showToast('Đã chia sẻ', 1500, 'fa-share-nodes');
          } catch (e) {
            if (e.name !== 'AbortError') showToast('Không thể chia sẻ', 1500, 'fa-circle-info');
          }
        } else {
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `ScanPro_${Date.now()}.pdf`;
          a.click();
          URL.revokeObjectURL(url);
          showToast('Đã tải về', 2000, 'fa-download');
        }
      });

      // ============ Settings ============
      settingsBtn.addEventListener('click', () => {
        showToast('Cài đặt đang phát triển', 1500, 'fa-gear');
      });

      // ============ Init ============
      cameraPlaceholder.addEventListener('click', async () => {
        await startCamera(currentFacingMode);
      });

      waitForOpenCV().then(() => {
        if (opencvReady) console.log('✅ OpenCV ready - Smart detection active');
      });

      window.addEventListener('beforeunload', () => {
        if (stream) stream.getTracks().forEach(t => t.stop());
        stopDetectionLoop();
      });

      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          closeModal();
          stopCamera();
          cameraPlaceholder.style.display = 'flex';
          video.style.display = 'none';
        }
      });

    })();
  </script>
</body>
</html>
