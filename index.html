<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ScanPro • PDF Scanner</title>
  <!-- Font & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <!-- jsPDF for PDF generation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f5f7fc;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 8px;
    }

    /* Mobile container – xịn xò, giới hạn chiều rộng */
    .phone-frame {
      width: 100%;
      max-width: 400px;
      height: 780px;
      max-height: 95vh;
      background: #ffffff;
      border-radius: 44px;
      box-shadow: 
        0 30px 60px -20px rgba(0, 20, 60, 0.35),
        0 0 0 2px rgba(255, 255, 255, 0.6) inset,
        0 0 0 1px rgba(0, 0, 0, 0.05);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      backdrop-filter: blur(10px);
    }

    /* Status bar giả lập */
    .status-bar {
      display: flex;
      justify-content: space-between;
      padding: 14px 24px 8px;
      font-size: 14px;
      font-weight: 600;
      color: #121826;
      background: white;
      letter-spacing: 0.2px;
    }

    .status-bar i {
      font-size: 14px;
      margin-left: 4px;
      color: #121826;
    }

    /* Main scrollable */
    .app-screen {
      flex: 1;
      overflow-y: auto;
      padding: 0 18px 10px;
      display: flex;
      flex-direction: column;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .app-screen::-webkit-scrollbar {
      display: none;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0 6px;
    }

    .header h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #0b1c3f, #1e3a8a);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header-actions i {
      font-size: 20px;
      color: #2c3e50;
      background: #f0f4fe;
      padding: 10px;
      border-radius: 50%;
      transition: all 0.2s;
    }

    /* Capture Card */
    .capture-card {
      background: linear-gradient(145deg, #ffffff, #f8faff);
      border-radius: 36px;
      padding: 18px;
      margin: 12px 0 16px;
      box-shadow: 0 12px 28px -8px rgba(0, 20, 50, 0.12), 0 0 0 1px rgba(255, 255, 255, 0.8) inset;
      border: 1px solid rgba(210, 222, 255, 0.6);
      position: relative;
    }

    .camera-preview {
      width: 100%;
      aspect-ratio: 3 / 4;
      background: #111827;
      border-radius: 28px;
      overflow: hidden;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 20px 30px -12px rgba(0, 0, 0, 0.3);
    }

    #videoPreview, #photoCanvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #0b0f1a;
    }

    #photoCanvas {
      display: none;
    }

    .camera-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #a0b3d9;
      font-size: 15px;
      font-weight: 500;
      gap: 8px;
      background: #111927;
      z-index: 2;
    }

    .camera-placeholder i {
      font-size: 44px;
      color: #4f6f9f;
      margin-bottom: 6px;
    }

    .camera-preview video,
    .camera-preview canvas {
      position: relative;
      z-index: 3;
    }

    .capture-controls {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 20px;
      gap: 18px;
    }

    .shutter-btn {
      background: #ffffff;
      border: none;
      width: 72px;
      height: 72px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px -5px rgba(0, 40, 100, 0.25), 0 0 0 4px #ffffff, 0 0 0 6px #d0dcff;
      transition: all 0.15s;
      cursor: pointer;
      color: #1e3a8a;
      font-size: 28px;
    }

    .shutter-btn:active {
      transform: scale(0.94);
      background: #f0f5ff;
      box-shadow: 0 6px 15px -3px rgba(0, 40, 100, 0.3), 0 0 0 4px #ffffff, 0 0 0 6px #a0b9ff;
    }

    .btn-secondary {
      background: #ecf2fe;
      border: none;
      width: 54px;
      height: 54px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1e3a8a;
      font-size: 22px;
      box-shadow: 0 6px 14px rgba(0, 30, 70, 0.08);
      transition: 0.2s;
      cursor: pointer;
    }

    .btn-secondary:active {
      background: #d3e0ff;
      transform: scale(0.94);
    }

    /* Gallery (scanned pages) */
    .gallery-title {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin: 6px 0 12px;
    }

    .gallery-title h3 {
      font-size: 17px;
      font-weight: 600;
      color: #121826;
      letter-spacing: -0.2px;
    }

    .gallery-title span {
      font-size: 14px;
      color: #5f6c84;
      background: #e6ecfd;
      padding: 4px 12px;
      border-radius: 30px;
      font-weight: 500;
    }

    .pages-grid {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding: 4px 2px 14px;
      scrollbar-width: none;
      -ms-overflow-style: none;
      min-height: 110px;
    }

    .pages-grid::-webkit-scrollbar {
      display: none;
    }

    .page-thumb {
      flex: 0 0 80px;
      height: 106px;
      border-radius: 18px;
      background: #eef2f8;
      border: 2px solid white;
      box-shadow: 0 10px 18px -8px rgba(0, 0, 0, 0.15);
      overflow: hidden;
      position: relative;
      transition: 0.2s;
      cursor: pointer;
    }

    .page-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .page-thumb .remove-badge {
      position: absolute;
      top: 4px;
      right: 4px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(4px);
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: #e11d48;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
      border: 1px solid rgba(255,255,255,0.6);
    }

    .empty-gallery {
      color: #8f9eb5;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100px;
      background: #f4f8ff;
      border-radius: 24px;
      font-weight: 500;
      border: 1px dashed #b8cbff;
    }

    /* Action Buttons */
    .action-bar {
      display: flex;
      gap: 12px;
      margin: 12px 0 10px;
    }

    .btn-primary {
      flex: 1;
      background: linear-gradient(135deg, #1e3a8a, #2563eb);
      border: none;
      border-radius: 26px;
      padding: 16px 10px;
      color: white;
      font-weight: 600;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 15px 25px -8px #1e3a8a80, 0 0 0 1px rgba(255,255,255,0.1) inset;
      transition: 0.2s;
      cursor: pointer;
    }

    .btn-primary:active {
      transform: scale(0.97);
      box-shadow: 0 8px 18px -6px #1e3a8a;
    }

    .btn-primary i {
      font-size: 18px;
    }

    .btn-outline {
      background: white;
      border: 1.5px solid #d0ddf5;
      border-radius: 26px;
      padding: 16px 18px;
      color: #1e3a8a;
      font-weight: 600;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 6px 14px rgba(0, 30, 70, 0.06);
      transition: 0.2s;
      cursor: pointer;
    }

    .btn-outline:active {
      background: #f0f6ff;
      transform: scale(0.97);
    }

    /* Toast / message */
    .toast-message {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(20, 30, 55, 0.9);
      backdrop-filter: blur(12px);
      color: white;
      font-weight: 500;
      font-size: 14px;
      padding: 12px 28px;
      border-radius: 60px;
      box-shadow: 0 20px 35px -8px black;
      z-index: 999;
      opacity: 0;
      transition: opacity 0.25s;
      pointer-events: none;
      white-space: nowrap;
      border: 1px solid rgba(255,255,255,0.15);
      letter-spacing: 0.2px;
    }

    .toast-message.show {
      opacity: 1;
    }

    /* hidden file input */
    #fileInput {
      display: none;
    }

    /* responsive */
    @media (max-width: 420px) {
      .phone-frame {
        height: 98vh;
        border-radius: 36px;
      }
      .app-screen {
        padding: 0 14px 8px;
      }
      .shutter-btn {
        width: 66px;
        height: 66px;
        font-size: 26px;
      }
    }

    /* fallback for iOS input */
    .capture-controls .btn-secondary i {
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="phone-frame">
    <!-- Status bar -->
    <div class="status-bar">
      <span>9:41</span>
      <span>
        <i class="fas fa-signal"></i>
        <i class="fas fa-wifi"></i>
        <i class="fas fa-battery-full"></i>
      </span>
    </div>

    <!-- Main app scroll -->
    <div class="app-screen">
      <!-- Header -->
      <div class="header">
        <h1>ScanPro</h1>
        <div class="header-actions">
          <i class="fas fa-sliders-h"></i>
        </div>
      </div>

      <!-- Camera preview + capture -->
      <div class="capture-card">
        <div class="camera-preview" id="cameraPreview">
          <video id="videoPreview" autoplay playsinline muted></video>
          <canvas id="photoCanvas"></canvas>
          <div class="camera-placeholder" id="cameraPlaceholder">
            <i class="fas fa-camera-retro"></i>
            <span>Nhấn để bật camera</span>
          </div>
        </div>

        <div class="capture-controls">
          <button class="btn-secondary" id="switchCameraBtn" title="Chuyển camera">
            <i class="fas fa-sync-alt"></i>
          </button>
          <button class="shutter-btn" id="captureBtn" title="Chụp ảnh">
            <i class="fas fa-circle"></i>
          </button>
          <button class="btn-secondary" id="uploadBtn" title="Tải ảnh lên">
            <i class="fas fa-image"></i>
          </button>
        </div>
        <input type="file" id="fileInput" accept="image/*" multiple>
      </div>

      <!-- Gallery: scanned pages -->
      <div class="gallery-title">
        <h3>Trang đã quét</h3>
        <span id="pageCount">0 trang</span>
      </div>

      <div class="pages-grid" id="pagesGrid">
        <div class="empty-gallery" id="emptyGallery">
          <i class="fas fa-file-pdf" style="margin-right: 8px;"></i> Chưa có trang nào
        </div>
      </div>

      <!-- Action buttons -->
      <div class="action-bar">
        <button class="btn-primary" id="exportPdfBtn">
          <i class="fas fa-file-pdf"></i> Xuất PDF
        </button>
        <button class="btn-outline" id="sharePdfBtn">
          <i class="fas fa-share-alt"></i> Chia sẻ
        </button>
      </div>
      <div style="height: 6px;"></div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast-message" id="toast">Thông báo</div>

  <script>
    (function() {
      // ---------- DOM elements ----------
      const video = document.getElementById('videoPreview');
      const canvas = document.getElementById('photoCanvas');
      const cameraPlaceholder = document.getElementById('cameraPlaceholder');
      const captureBtn = document.getElementById('captureBtn');
      const switchCameraBtn = document.getElementById('switchCameraBtn');
      const uploadBtn = document.getElementById('uploadBtn');
      const fileInput = document.getElementById('fileInput');
      const pagesGrid = document.getElementById('pagesGrid');
      const emptyGallery = document.getElementById('emptyGallery');
      const pageCountSpan = document.getElementById('pageCount');
      const exportPdfBtn = document.getElementById('exportPdfBtn');
      const sharePdfBtn = document.getElementById('sharePdfBtn');
      const toastEl = document.getElementById('toast');

      // ---------- State ----------
      let stream = null;
      let currentFacingMode = 'environment'; // sau
      let scannedPages = []; // mảng các dataURL (jpeg/png)
      let cameraActive = false;

      // ---------- Toast helper ----------
      function showToast(msg, duration = 2000) {
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        clearTimeout(window.toastTimeout);
        window.toastTimeout = setTimeout(() => {
          toastEl.classList.remove('show');
        }, duration);
      }

      // ---------- Camera handling ----------
      async function startCamera(facingMode = 'environment') {
        // Dừng stream cũ nếu có
        if (stream) {
          stream.getTracks().forEach(track => track.stop());
          stream = null;
        }
        try {
          const constraints = {
            video: { facingMode: facingMode, width: { ideal: 1280 }, height: { ideal: 720 } },
            audio: false
          };
          stream = await navigator.mediaDevices.getUserMedia(constraints);
          video.srcObject = stream;
          await video.play();
          cameraActive = true;
          cameraPlaceholder.style.display = 'none';
          video.style.display = 'block';
          canvas.style.display = 'none';
          currentFacingMode = facingMode;
        } catch (err) {
          console.warn('Camera error:', err);
          showToast('Không thể truy cập camera');
          cameraActive = false;
          cameraPlaceholder.style.display = 'flex';
          video.style.display = 'none';
          canvas.style.display = 'none';
          // Nếu có stream cũ, dừng lại
          if (stream) {
            stream.getTracks().forEach(track => track.stop());
            stream = null;
          }
        }
      }

      function stopCamera() {
        if (stream) {
          stream.getTracks().forEach(track => track.stop());
          stream = null;
        }
        cameraActive = false;
        video.style.display = 'none';
        canvas.style.display = 'none';
        cameraPlaceholder.style.display = 'flex';
      }

      // Khởi tạo camera ban đầu (chỉ khi người dùng bấm, tránh autoplay fail)
      // Nhưng ta có thể thử yêu cầu nhẹ, nếu lỗi thì hiện placeholder.
      // Nhưng vì mobile, tốt hơn để người dùng bấm capture lần đầu sẽ tự bật camera.
      // Chúng ta sẽ bật camera lần đầu khi bấm nút chụp (nếu chưa bật)
      
      // Nút chụp: nếu camera chưa bật, bật camera trước, sau đó chụp.
      captureBtn.addEventListener('click', async () => {
        if (!cameraActive) {
          await startCamera(currentFacingMode);
          // Đợi 1 chút cho video ổn định
          setTimeout(() => {
            if (cameraActive) capturePhoto();
          }, 300);
          return;
        }
        capturePhoto();
      });

      function capturePhoto() {
        if (!video.videoWidth || !video.videoHeight) {
          showToast('Camera chưa sẵn sàng');
          return;
        }
        // Vẽ frame hiện tại vào canvas
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        // Lấy data URL (chất lượng 0.92)
        const dataURL = canvas.toDataURL('image/jpeg', 0.92);
        
        // Thêm vào mảng
        scannedPages.push(dataURL);
        updateGalleryAndCount();

        // Hiệu ứng nháy màn hình
        canvas.style.display = 'block';
        video.style.display = 'none';
        setTimeout(() => {
          if (cameraActive && stream) {
            canvas.style.display = 'none';
            video.style.display = 'block';
          }
        }, 150);

        showToast('Đã thêm trang', 1200);
      }

      // Chuyển camera trước/sau
      switchCameraBtn.addEventListener('click', async () => {
        const newMode = currentFacingMode === 'environment' ? 'user' : 'environment';
        if (cameraActive) {
          await startCamera(newMode);
        } else {
          await startCamera(newMode);
        }
        showToast(newMode === 'environment' ? 'Camera sau' : 'Camera trước', 1000);
      });

      // Upload ảnh từ thiết bị
      uploadBtn.addEventListener('click', () => {
        fileInput.click();
      });

      fileInput.addEventListener('change', (e) => {
        const files = e.target.files;
        if (!files || files.length === 0) return;

        let processed = 0;
        Array.from(files).forEach(file => {
          if (!file.type.startsWith('image/')) return;
          const reader = new FileReader();
          reader.onload = (ev) => {
            scannedPages.push(ev.target.result);
            processed++;
            if (processed === files.length) {
              updateGalleryAndCount();
              showToast(`Đã thêm ${files.length} ảnh`, 1500);
            }
          };
          reader.readAsDataURL(file);
        });
        fileInput.value = ''; // reset
      });

      // Cập nhật gallery và số trang
      function updateGalleryAndCount() {
        // Xoá gallery cũ (giữ emptyGallery? ta sẽ render lại toàn bộ)
        pagesGrid.innerHTML = '';
        if (scannedPages.length === 0) {
          pagesGrid.appendChild(emptyGallery);
        } else {
          scannedPages.forEach((dataUrl, index) => {
            const thumbDiv = document.createElement('div');
            thumbDiv.className = 'page-thumb';
            const img = document.createElement('img');
            img.src = dataUrl;
            img.alt = `Trang ${index + 1}`;
            thumbDiv.appendChild(img);
            
            // Nút xoá
            const removeBadge = document.createElement('div');
            removeBadge.className = 'remove-badge';
            removeBadge.innerHTML = '<i class="fas fa-times"></i>';
            removeBadge.addEventListener('click', (e) => {
              e.stopPropagation();
              scannedPages.splice(index, 1);
              updateGalleryAndCount();
              showToast('Đã xoá trang', 1000);
            });
            thumbDiv.appendChild(removeBadge);
            
            // Nhấn vào thumb có thể xem trước (nhưng không cần)
            pagesGrid.appendChild(thumbDiv);
          });
        }
        pageCountSpan.textContent = `${scannedPages.length} trang`;
      }

      // Khởi tạo emptyGallery
      updateGalleryAndCount();

      // ---------- PDF Export ----------
      async function generatePdf() {
        if (scannedPages.length === 0) {
          showToast('Chưa có trang nào để xuất PDF');
          return null;
        }

        showToast('Đang tạo PDF...', 1200);

        try {
          const { jsPDF } = window.jspdf;
          // Tạo PDF khổ A4 dọc (tùy chỉnh)
          const pdf = new jsPDF({
            orientation: 'portrait',
            unit: 'mm',
            format: 'a4'
          });

          const pageWidth = pdf.internal.pageSize.getWidth();
          const pageHeight = pdf.internal.pageSize.getHeight();
          const margin = 10; // mm
          const maxImgWidth = pageWidth - 2 * margin;
          const maxImgHeight = pageHeight - 2 * margin;

          for (let i = 0; i < scannedPages.length; i++) {
            if (i > 0) pdf.addPage();

            const imgData = scannedPages[i];
            // Tạo Image để lấy kích thước
            const img = new Image();
            img.src = imgData;
            await new Promise((resolve) => {
              img.onload = resolve;
              img.onerror = resolve;
            });

            const imgWidth = img.width || 800;
            const imgHeight = img.height || 600;

            // Tính tỉ lệ để fit trong khung A4
            const ratio = Math.min(maxImgWidth / imgWidth, maxImgHeight / imgHeight);
            const renderWidth = imgWidth * ratio;
            const renderHeight = imgHeight * ratio;
            const x = (pageWidth - renderWidth) / 2;
            const y = (pageHeight - renderHeight) / 2;

            pdf.addImage(imgData, 'JPEG', x, y, renderWidth, renderHeight);
          }

          return pdf.output('blob'); // Blob
        } catch (err) {
          console.error('PDF error:', err);
          showToast('Lỗi tạo PDF');
          return null;
        }
      }

      // Xuất PDF (tải về)
      exportPdfBtn.addEventListener('click', async () => {
        const pdfBlob = await generatePdf();
        if (!pdfBlob) return;

        const url = URL.createObjectURL(pdfBlob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `ScanPro_${Date.now()}.pdf`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast('Đã tải PDF về máy', 2000);
      });

      // Chia sẻ PDF (sử dụng Web Share API)
      sharePdfBtn.addEventListener('click', async () => {
        const pdfBlob = await generatePdf();
        if (!pdfBlob) return;

        const file = new File([pdfBlob], `ScanPro_${Date.now()}.pdf`, { type: 'application/pdf' });

        // Kiểm tra Web Share API
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({
              files: [file],
              title: 'Tài liệu quét từ ScanPro',
              text: 'Chia sẻ file PDF từ ứng dụng ScanPro'
            });
            showToast('Đã chia sẻ thành công', 1500);
          } catch (err) {
            if (err.name !== 'AbortError') {
              showToast('Không thể chia sẻ');
            }
          }
        } else if (navigator.share) {
          // Fallback chia sẻ text + url (không file)
          const url = URL.createObjectURL(pdfBlob);
          try {
            await navigator.share({
              title: 'Tài liệu PDF',
              text: 'Xem file PDF từ ScanPro',
              url: url
            });
            // không thu hồi URL ngay do share đang mở
          } catch (err) {
            showToast('Không thể chia sẻ');
          }
        } else {
          // Tải xuống như phương án cuối
          const url = URL.createObjectURL(pdfBlob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `ScanPro_${Date.now()}.pdf`;
          a.click();
          URL.revokeObjectURL(url);
          showToast('Thiết bị không hỗ trợ chia sẻ, đã tải về', 2000);
        }
      });

      // Dừng camera khi trang ẩn (tránh tiêu tốn pin)
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          stopCamera();
        } else {
          // Không tự bật lại, người dùng sẽ bấm chụp
          cameraPlaceholder.style.display = 'flex';
          video.style.display = 'none';
          canvas.style.display = 'none';
          cameraActive = false;
        }
      });

      // Khởi tạo placeholder, camera sẽ bật khi bấm nút chụp lần đầu
      // nhưng nếu người dùng muốn bật sớm, nhấn shutter sẽ kích hoạt.
      // Thêm sự kiện click vào placeholder để bật camera nhanh
      cameraPlaceholder.addEventListener('click', async () => {
        if (!cameraActive) {
          await startCamera(currentFacingMode);
        }
      });

      // Dọn dẹp khi unload
      window.addEventListener('beforeunload', () => {
        if (stream) {
          stream.getTracks().forEach(track => track.stop());
        }
      });

      // Fix lỗi file input trên một số trình duyệt
      window.addEventListener('load', () => {
        // Không tự bật camera, để người dùng tương tác
      });
    })();
  </script>
</body>
</html>
